name = "athar-books"
main = "worker.js"
compatibility_date = "2026-07-01"

# Create the namespace first:  npx wrangler kv namespace create BOOKS
# then paste the returned id below.
[[kv_namespaces]]
binding = "BOOKS"
id = "PASTE_KV_NAMESPACE_ID_HERE"

# Click/page-time analytics. No setup command needed — the dataset below
# ("athar_events") is created automatically the first time the Worker
# writes to it. Querying it back out (the admin insights panel) needs two
# more things this file can't hold: an API token and your account ID —
# see the deploy notes for exactly where those go.
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "athar_events"

[vars]
CF_ACCOUNT_ID = "0bf7580e98d364f38e74625a89d4a273"
