  function adminView() {
    if (!S.user) {
      return '<div class="gate"><b>' + TXT.gateSignInTitle + '</b>' +
        '<div class="gateBtns"><button class="btn" data-auth="signin">' + TXT.signIn + '</button></div></div>';
    }
    if (!S.user.founder) return '<p class="lead">' + TXT.adminNotFounder + '</p>';
    if (!S.adminStats && !S.adminDump) {
      return '<h2>' + TXT.h2Admin + '</h2><p class="lead">' + TXT.btnSending + '</p>';
    }

    var h = '<h2>' + TXT.h2Admin + '</h2><p class="lead">' + TXT.adminHiPrefix + esc(S.user.founder) + '</p>';

    if (S.adminStats) {
      var st = S.adminStats;
      var labels = {
        signup: TXT.adminEvSignup, shelfLoad: TXT.adminEvVisits, publish: TXT.adminEvPublish,
        verification: TXT.adminEvVerify, reservation: TXT.adminEvReserve, exchange: TXT.adminEvExchange,
      };
      h += '<h3 class="goalsTitle">' + TXT.adminStatsTitle + '</h3>' +
        '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:16px">';
      Object.keys(labels).forEach(function (ev) {
        h += '<div class="card" style="padding:10px 12px">' +
          '<b style="font-family:\'Space Mono\',monospace;font-size:20px;color:var(--green-d);display:block">' +
          esc((st.totals && st.totals[ev]) || 0) + '</b>' +
          '<span class="lead" style="font-size:12px">' + labels[ev] + '</span>' +
          adminSparkline(st.daily && st.daily[ev]) + '</div>';
      });
      h += '<div class="card" style="padding:10px 12px">' +
        '<b style="font-family:\'Space Mono\',monospace;font-size:20px;color:var(--green-d);display:block">' +
        esc(st.doneAllTime || 0) + '</b><span class="lead" style="font-size:12px">' + TXT.adminAllTime + '</span></div></div>';

      // Click/page-time layer, from Analytics Engine via /track — see
      // queryAnalytics() in worker.js. Separate section, separate data
      // source, own range picker (day/week/month/year re-queries just this
      // block, not the KV counters above it).
      h += '<h3 class="goalsTitle">' + TXT.adminInsightsTitle + '</h3>' +
        '<div class="opts" style="margin-bottom:10px">' +
        adminRangeBtn("day", TXT.adminRangeDay) + adminRangeBtn("week", TXT.adminRangeWeek) +
        adminRangeBtn("month", TXT.adminRangeMonth) + adminRangeBtn("year", TXT.adminRangeYear) +
        '</div>';

      var ins = st.insights;
      if (!ins) {
        h += '<p class="lead">' + TXT.adminInsightsOff + '</p>';
      } else {
        var viewSeries = insightsTrendSeries(ins.trend, "view");
        var clickSeries = insightsTrendSeries(ins.trend, "click");
        var totalViewN = 0, totalViewMs = 0;
        (ins.trend || []).forEach(function (r) {
          if (r.kind === "view") { totalViewN += Number(r.n) || 0; totalViewMs += Number(r.totalMs) || 0; }
        });
        h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-bottom:16px">' +
          '<div class="card" style="padding:10px 12px"><span class="lead" style="font-size:12px">' + TXT.adminViewsTrend + '</span>' +
          adminSparkline(viewSeries) + '</div>' +
          '<div class="card" style="padding:10px 12px"><span class="lead" style="font-size:12px">' + TXT.adminClicksTrend + '</span>' +
          adminSparkline(clickSeries) + '</div>' +
          '<div class="card" style="padding:10px 12px">' +
          '<b style="font-family:\'Space Mono\',monospace;font-size:20px;color:var(--green-d);display:block">' +
          (totalViewN ? fmtDwell(totalViewMs / totalViewN) : "—") + '</b>' +
          '<span class="lead" style="font-size:12px">' + TXT.adminAvgDwell + '</span></div></div>';

        h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px">' +
          '<div><div style="font-weight:700;font-size:14px;margin-bottom:6px">' + TXT.adminTopViews + '</div>' +
          adminTopList(ins.topViews, true) + '</div>' +
          '<div><div style="font-weight:700;font-size:14px;margin-bottom:6px">' + TXT.adminTopClicks + '</div>' +
          adminTopList(ins.topClicks, false) + '</div></div>';
      }
    }

    if (S.adminDump) {
      var posts = adminPosts();
      h += '<h3 class="goalsTitle">' + TXT.adminPostsTitle + '</h3>';
      h += posts.length ? posts.map(adminPostRow).join("") : '<p class="lead">' + TXT.adminPostsEmpty + '</p>';

      var users = S.adminDump.users || [];
      h += '<h3 class="goalsTitle">' + TXT.adminUsersTitle + '</h3>';
      h += users.length ? users.map(adminUserRow).join("") : '<p class="lead">' + TXT.adminNoUsers + '</p>';

      var founders = S.adminDump.founders || [];
      h += '<h3 class="goalsTitle">' + TXT.adminFoundersTitle + '</h3>';
      // The owner is OWNER_EMAIL, not a row in the founders KV list — shown
      // here as a fixed first card, badge-only, no remove button ever.
      h += '<div class="card" style="margin-bottom:10px">' +
        '<b>' + esc(S.adminDump.ownerName || "") + '</b> ' +
        '<span class="ver">' + TXT.adminFounderOwnerBadge + '</span></div>';
      h += founders.length ? founders.map(adminFounderRow).join("")
        : '<p class="lead">' + TXT.adminFoundersEmpty + '</p>';
      h += '<div class="field" style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">' +
        '<input id="founderEmail" placeholder="' + TXT.adminFounderEmailPh + '" style="flex:2;min-width:160px">' +
        '<input id="founderName" placeholder="' + TXT.adminFounderNamePh + '" style="flex:1;min-width:120px">' +
        '<button type="button" class="btn ghost" data-ffounder="1"' + (S.adminBusy ? " disabled" : "") + '>' +
        TXT.adminBtnAddFounder + '</button></div>';

      var log = S.adminDump.log || [];
      if (log.length) {
        h += '<h3 class="goalsTitle">' + TXT.adminLogTitle + '</h3>' +
          '<div class="card">' + log.slice(0, 30).map(adminLogRow).join("") + '</div>';
      }
    }
    return h;
  }

  /* ---------------- village picker ---------------- */
  function homeView() {
    var byReg = {}, order = [];
    VILLAGES.forEach(function (v) {
      if (!byReg[v.region]) { byReg[v.region] = []; order.push(v.region); }
      byReg[v.region].push(v);
    });
    var h = '<div class="wrap"><header class="masthead"><div><span class="brand">أثر</span><h1>تبادل الكتب المدرسية</h1>' +
      '<p>اختر بلدك. بتقدر تغيّرها بعدين.</p></div></header><div class="card">' +
      '<h2>' + TXT.h2PickHome + '</h2><p class="lead">' + TXT.leadPickHome + '</p>';
    order.forEach(function (r) {
      h += '<div class="field"><label class="lbl">' + esc(r) + '</label><div class="opts">' +
        byReg[r].map(function (v) { return '<div class="opt" data-home="' + v.code + '">' + esc(v.name) + '</div>'; }).join("") +
        '</div></div>';
    });
    return h + '</div></div>';
  }

  /* ---------------- render ---------------- */
  function render() {
    if (!S.home) { root.innerHTML = homeView(); bind(); return; }
    if (S.tab !== lastRenderedTab) { trackView(S.tab); lastRenderedTab = S.tab; }
    // A signed-in account with no phone yet is mid-signup, not a real user
    // of the site — every tab shows profileGateCard() instead of its usual
    // content until that's fixed, not just the add-book screen the way it
    // used to. Sign-out (see head(), rendered unconditionally below) is the
    // only way out of this state besides finishing it.
    var needsProfile = !!(S.user && !S.user.phone);
    // Page-scoped palette + pattern. Each page overrides a few tokens so
    // moving between them feels like rooms in one house.
    var pageCls = needsProfile ? "pgAdd"
                : S.tab === "add" ? "pgAdd" : S.tab === "mine" ? "pgAdd" : S.tab === "admin" ? "pgAdd"
                : S.tab === "about" ? "pgAbout"
                : S.tab === "contact" ? "pgAbout" : S.tab === "feedback" ? "pgAbout" : "pgShelf";
    root.innerHTML = '<div class="wrap ' + pageCls + '">' + head() +
      (S.tab === "auth" ? authView()
        : needsProfile ? profileGateCard()
        : S.tab === "about" ? aboutView()
        : S.tab === "contact" ? contactView()
        : S.tab === "feedback" ? feedbackView()
        : S.tab === "add" ? addView()
        : S.tab === "mine" ? myPostsView()
        : S.tab === "admin" ? adminView()
        : S.open ? detailView()
        : (a2hsEligible() ? a2hsBanner() : '') +
          (S.linkMiss
             ? '<div class="notice">الكتاب اللي وصلك رابطه ما عاد موجود — يمكن حدا أخده. ' +
               'تحت كل الكتب المتوفرة حاليًا.</div>'
             : '') + filters() + listView()) +
      '<p class="foot">اللي بتكتبه بيظهر لكل من بيفتح الصفحة. لا تنشر رقم تلفون طالب قاصر.' +
      '<br><button class="linkish" data-tab="contact">تواصل معنا</button>' +
      // This warned about temporary storage whenever window.storage was missing
      // — which is always, in a real browser. It showed on the live site even
      // with the Worker wired up. The real condition is "no API".
      (API ? "" : "<br>الإعلانات محفوظة مؤقتًا فقط — لازم تربط قاعدة بيانات قبل الإطلاق.") +
      '</p></div>';
    bind();
    fetchPics();
    highlight();
  }

  function fetchPics() {
    var want = [];
    root.querySelectorAll("[data-pic]").forEach(function (el) {
      var id = el.dataset.pic;
      if (!picMem[id] && !picWanted[id]) { picWanted[id] = 1; want.push(id); }
    });
    if (!want.length) return;
    var i = 0;
    (function next() {
      if (i >= want.length) return;
      var id = want[i++];
      fetch(API + "/pic?id=" + encodeURIComponent(id)).then(function (r) { return r.ok ? r.json() : null; })
        .then(function (o) { return o ? o.value : null; }).catch(function () { return null; })
      .then(function (v) {
        if (typeof v === "string" && v) {
          picMem[id] = v;
          var el = root.querySelector('[data-pic="' + id + '"]');
          if (el) el.innerHTML = '<img src="' + v + '" alt="">';
        }
        next();
      });
    })();
  }

  /* ---------------- reads ---------------- */
  function readMe() {
    var c = document.getElementById("mSch"); if (c) S.me.school = c.value;
  }
  function readBook() {
    var g = document.getElementById("bG"); if (g) S.b.grade = g.value;
    var s = document.getElementById("bS"); if (s) S.b.subject = s.value;
    var t = document.getElementById("bT"); if (t) S.b.title = t.value;
    var ds = document.getElementById("bD"); if (ds) S.b.desc = ds.value;
  }

  /* ---------------- events ---------------- */
  function bind() {
    root.querySelectorAll("[data-home]").forEach(function (b) {
      b.onclick = function () { S.home = b.dataset.home; save(K_HOME, S.home); render(); refresh(); };
    });
    root.querySelectorAll("[data-auth]").forEach(function (b) {
      b.onclick = function () {
        S.authErr = ""; S.tab = "auth";
        window.scrollTo(0, 0); render();
      };
    });
    var mb = document.getElementById("menuBtn");
    if (mb) mb.onclick = function () { S.navOpen = true; render(); };
    var nc = document.getElementById("navClose");
    if (nc) nc.onclick = function () { S.navOpen = false; render(); };
    var scrim = document.getElementById("navScrim");
    if (scrim) scrim.onclick = function () { S.navOpen = false; render(); };
    root.querySelectorAll("[data-nav]").forEach(function (b) {
      b.onclick = function () {
        S.navOpen = false; S.tab = b.dataset.nav; S.open = null;
        window.scrollTo(0, 0); render();
        if (b.dataset.nav === "admin" && S.user && S.user.founder) loadAdmin();
      };
    });

    var ch = document.getElementById("chgHome");
    if (ch) ch.onclick = function () { S.home = null; S.ready = false; render(); };

    root.querySelectorAll("[data-scope]").forEach(function (b) {
      b.onclick = function () { S.scope = b.dataset.scope; S.ready = false; render(); refresh(); };
    });
    root.querySelectorAll("[data-tab]").forEach(function (b) {
      b.onclick = function () { S.tab = b.dataset.tab; S.err = ""; S.acctMsg = ""; render(); };
    });
    root.querySelectorAll("[data-g]").forEach(function (b) {
      b.onclick = function () { S.grade = b.dataset.g; render(); };
    });
    root.querySelectorAll("[data-genre]").forEach(function (b) {
      b.onclick = function () { S.genre = b.dataset.genre; render(); };
    });
    root.querySelectorAll("[data-age]").forEach(function (b) {
      b.onclick = function () { S.age = b.dataset.age; render(); };
    });
    root.querySelectorAll("[data-cat]").forEach(function (b) {
      b.onclick = function () { S.cat = b.dataset.cat; S.open = null; render(); };
    });
    var sub = document.getElementById("fSub"); if (sub) sub.onchange = function () { S.subject = sub.value; render(); };
    var sch = document.getElementById("fSch"); if (sch) sch.onchange = function () { S.school = sch.value; render(); };
    root.querySelectorAll("[data-open]").forEach(function (el) {
      el.onclick = function (e) {
        if (e.target.closest("button, a") && e.target.closest("[data-open]") !== e.target) {
          if (el.tagName !== "BUTTON") return;
        }
        S.open = el.dataset.open || null;
        window.scrollTo(0, 0);
        render();
      };
    });
    // Empty-state escape hatches.
    root.querySelectorAll("[data-clr]").forEach(function (b) {
      b.onclick = function () { clearFilter(b.dataset.clr); render(); };
    });
    root.querySelectorAll("[data-post]").forEach(function (b) {
      // Only ever reached from emptyCold()'s CTA, whose label already names
      // the current category ("اعرض رواية"/"اعرض قرطاسية"/"اعرض كتاب"/"اعرض
      // كتاب أو رواية") — so the add form should open on that same
      // category, not default to book. For "gen" specifically, seed a
      // valid genre right away rather than leaving whatever S.b.subject
      // happened to hold from a previous school-book draft — bookCard()
      // and addToBatch() both already guard against that stale value, but
      // starting clean here means the picker's "on" state matches S.b
      // from the very first render instead of only after a click.
      b.onclick = function () {
        S.mode = b.dataset.post; S.b.cat = S.cat;
        if (S.cat === "gen" && S.b.subject !== GEN_FICTION && S.b.subject !== GEN_NONFIC) S.b.subject = GEN_FICTION;
        S.tab = "add"; S.err = ""; render();
      };
    });
    root.querySelectorAll("[data-wantit]").forEach(function (b) {
      b.onclick = function () {
        // Carry the filters already set into the request form, so "there is no
        // grade 7 maths book" turns into a request for one.
        S.mode = "wants"; S.batch = []; S.b.cat = S.cat;
        if (S.cat === "gen") {
          if (S.genre !== "all") S.b.subject = S.genre;
          if (S.age !== "all") S.b.age = S.age;
        } else {
          if (S.grade !== "all") S.b.grade = S.grade;
          if (S.subject !== "all") S.b.subject = S.subject;
        }
        S.tab = "add"; S.err = ""; render();
      };
    });
    root.querySelectorAll("[data-act]").forEach(function (b) {
      b.onclick = function () { mutate(b.dataset.act, b.dataset.id); };
    });
    root.querySelectorAll("[data-mact]").forEach(function (b) {
      b.onclick = function () { mutateMine(b.dataset.mkind, b.dataset.mact, b.dataset.mid); };
    });
    root.querySelectorAll("[data-fact]").forEach(function (b) {
      b.onclick = function () { adminAction(b.dataset.fact, b.dataset.fid); };
    });
    root.querySelectorAll("[data-fnote]").forEach(function (b) {
      b.onclick = function () { addAdminNote(b.dataset.fnote); };
    });
    root.querySelectorAll("[data-ffounder]").forEach(function (b) {
      b.onclick = function () { addFounder(); };
    });
    root.querySelectorAll("[data-range]").forEach(function (b) {
      b.onclick = function () { if (!S.adminBusy) loadAdminStats(b.dataset.range); };
    });

    root.querySelectorAll("[data-opt]").forEach(function (o) {
      o.onclick = function () {
        readMe(); readBook();
        var n = o.dataset.opt, v = o.dataset.val;
        if (n === "mode") { S.mode = (v === "عندي كتب") ? "offers" : "wants"; S.batch = []; }
        else if (n === "handoff") S.me.handoff = (v === PICKUP) ? "point" : "direct";
        else if (n === "cat") {
          S.b.cat = (v === STAT) ? "stat" : (v === TXT.filterGen) ? "gen" : (v === NOVEL) ? "novel" : "book";
          // Starting a general-library post fresh needs a sane default genre —
          // otherwise a leftover school subject from a prior draft would sit
          // in b.subject looking like a genre pick nobody actually made.
          if (S.b.cat === "gen" && S.b.subject !== GEN_FICTION && S.b.subject !== GEN_NONFIC) S.b.subject = GEN_FICTION;
        }
        else if (n === "genre") S.b.subject = v;
        else if (n === "age") S.b.age = v;
        else if (n === "cond") S.b.cond = v;
        render();
      };
    });

    var ga = document.getElementById("gAuth"); if (ga) ga.onclick = googleAuth;
    var ie = document.getElementById("iabEscape"); if (ie) ie.onclick = escapeToBrowser;
    var ic = document.getElementById("iabCopy"); if (ic) ic.onclick = copyIabLink;
    var ita = document.getElementById("iabTryAnyway");
    if (ita) ita.onclick = function () { S.forceAuth = true; render(); };
    var ac = document.getElementById("a2hsClose"); if (ac) ac.onclick = dismissA2hs;
    var dp = document.getElementById("doProfile"); if (dp) dp.onclick = saveProfile;
    var so = document.getElementById("signOut"); if (so) so.onclick = signOut;
    var ep = document.getElementById("editProfile");
    if (ep) ep.onclick = function () { S.editingProfile = true; S.profileDraft = null; S.authErr = ""; S.acctMsg = ""; render(); };
    var cp = document.getElementById("cancelProfile");
    if (cp) cp.onclick = function () { S.editingProfile = false; S.profileDraft = null; S.authErr = ""; render(); };

    var em = document.getElementById("editMe"); if (em) em.onclick = function () { S.editMe = true; render(); };
    var dm = document.getElementById("doneMe"); if (dm) dm.onclick = function () { readMe(); S.editMe = false; render(); };

    var pic = document.getElementById("bPic");
    if (pic) pic.onchange = function () {
      var f = pic.files && pic.files[0];
      if (!f) return;
      readMe(); readBook();
      shrink(f, 520, 0.6).then(function (d) { S.b.pic = d; render(); })
        .catch(function () { S.err = TXT.errPhotoOpen; render(); });
    };
    var rm = document.getElementById("rmPic");
    if (rm) rm.onclick = function () { readMe(); readBook(); S.b.pic = ""; render(); };

    var ad = document.getElementById("bAdd"); if (ad) ad.onclick = addToBatch;
    root.querySelectorAll("[data-rm]").forEach(function (b) {
      b.onclick = function () { readMe(); readBook(); S.batch.splice(+b.dataset.rm, 1); saveDraft(); render(); };
    });
    var pa = document.getElementById("pubAll"); if (pa) pa.onclick = publishAll;

    var sf = document.getElementById("sendFeedback");
    if (sf) sf.onclick = function () {
      var t = document.getElementById("fbText"), v = t ? t.value.trim() : "";
      if (!v) { S.err = TXT.feedbackErrEmpty; return render(); }
      S.err = "";
      window.open(waLink(CONTACT_PHONE, "ملاحظة على صفحة أثر:\n" + v), "_blank", "noopener,noreferrer");
    };
  }

  function addToBatch() {
    readMe(); readBook();

    if (!S.b.title.trim() && !S.b.pic) {
      S.err = TXT.errTitleOrPhoto; return render();
    }
    if (S.batch.length >= MAX_BATCH) { S.err = TXT.errBatchFull; return render(); }

    // The book is banked before anyone is sent to sign in, so nothing is
    // retyped afterwards.
    S.err = "";
    var gen = S.b.cat === "gen";
    S.batch.push({ cat: S.b.cat,
                   grade: (S.b.cat === "stat" || S.b.cat === "novel" || gen) ? "" : S.b.grade,
                   // A stale subject from a previous school-book draft never
                   // leaks through here even if the "gen" cat picker was
                   // clicked without touching the genre toggle afterwards —
                   // whatever's in S.b.subject is only trusted when it's
                   // actually one of the two genre labels.
                   subject: S.b.cat === "stat" ? STAT : S.b.cat === "novel" ? NOVEL
                          : gen ? (S.b.subject === GEN_NONFIC ? GEN_NONFIC : GEN_FICTION) : S.b.subject,
                   kind: "كتاب", title: S.b.title.trim(), cond: S.b.cond, pic: S.b.pic,
                   desc: (S.b.desc || "").trim(), age: gen ? (S.b.age || "any") : "" });
    S.b.title = ""; S.b.pic = ""; S.b.desc = "";
    saveDraft();
    save(K_ME, S.me);

    if (!S.user) { S.tab = "auth"; window.scrollTo(0, 0); }
    render();
  }

  function publishAll() {
    readMe(); readBook();
    if (!S.user) { S.tab = "auth"; window.scrollTo(0, 0); return render(); }
    // Phone not on file yet: the profile gate above the form is showing —
    // scroll to it instead of firing a request the Worker will reject.
    if (!S.user.phone) { window.scrollTo(0, 0); S.err = TXT.errNeedProfile; return render(); }
    // No verification check here — the Worker accepts publishes from unapproved
    // accounts by design and seals their contact details instead.
    S.busy = true; S.err = ""; S.progress = TXT.btnPublishing; render();

    var c = creds(), pics = {};
    S.batch.forEach(function (b, i) { if (b.pic) pics[String(i)] = b.pic; });
    return api("/publish", {
      village: S.home, kind: S.mode, uid: c.uid, tok: c.tok, name: c.name,
      records: S.batch.map(function (b) {
        return { cat: b.cat, grade: b.grade, subject: b.subject, kind: b.kind, title: b.title,
                 cond: b.cond, desc: b.desc || "", school: S.me.school, handoff: S.me.handoff,
                 age: b.age || "" };
      }),
      pics: pics
    }).then(function (d) {
      S.busy = false; S.progress = "";
      if (d && d.ok) { S.batch = []; saveDraft(); S.tab = S.mode; }
      else if (d && d.error === "blocked") S.err = TXT.errBlocked;
      else S.err = TXT.errPublishFail;
      render(); refresh();
    }).catch(function () {
      S.busy = false; S.err = TXT.errOffline; render();
    });
  }

  // Same job as mutate() below, but for the My Posts screen, which shows
  // offers and wants side by side — there's no single S.tab to infer which
  // list an item belongs to, so the caller says so explicitly.
  function mutateMine(kind, act, id) {
    var c = creds();
    if (!c.uid) return;
    S.busy = true; render();
    api("/update", { village: S.home, kind: kind, id: id, act: act, uid: c.uid, tok: c.tok, name: c.name })
      .then(function (d) {
        S.busy = false;
        if (!d || !d.ok) S.err = (d && d.error === "unavailable") ? TXT.errTaken : TXT.errActionFail;
        refresh();
      })
      .catch(function () { S.busy = false; S.err = TXT.errOfflineRetry; render(); });
  }

  /* ---------------- control panel data ----------------
     Founder status itself is resolved server-side (see /data's me.founder)
     and needs no action here — this is just loading the panel's content
     once someone with that status opens it.
     ------------------------------------------------------------------ */
  function loadAdmin() {
    if (!S.user || !S.user.founder) return;
    S.adminBusy = true; render();
    var creds2 = { uid: S.user.uid, tok: S.user.tok };
    Promise.all([
      api("/admin", Object.assign({ act: "stats", range: S.adminRange }, creds2)),
      api("/admin", Object.assign({ act: "dump", village: S.home }, creds2)),
    ]).then(function (r) {
      S.adminBusy = false;
      S.adminStats = r[0] && !r[0].error ? r[0] : null;
      S.adminDump = r[1] && !r[1].error ? r[1] : null;
      render();
    }).catch(function () { S.adminBusy = false; render(); });
  }

  // Switching the day/week/month/year toggle only needs to re-run the
  // "stats" call (which carries insights) — the users list and audit log
  // from "dump" don't depend on range, so they're left alone here.
  function loadAdminStats(range) {
    if (!S.user || !S.user.founder) return;
    S.adminRange = range;
    S.adminBusy = true; render();
    api("/admin", { uid: S.user.uid, tok: S.user.tok, act: "stats", range: range })
      .then(function (r) {
        S.adminBusy = false;
        S.adminStats = r && !r.error ? r : null;
        render();
      }).catch(function () { S.adminBusy = false; render(); });
  }

  // One handler for every button in the users table — approve, block,
  // claim, reset, purge, notes — all the same shape on the wire: the
  // founder's own session plus {act, target, ...extra}.
  function adminAction(act, uid, extra) {
    if (!S.user || !S.user.founder) return;
    if (act === "purgeUser" && !confirm(TXT.adminPurgeConfirm)) return;
    var body = { uid: S.user.uid, tok: S.user.tok, act: act, village: S.home, target: uid };
    if (extra) Object.assign(body, extra);
    S.adminBusy = true; render();
    api("/admin", body)
      .then(function () { loadAdmin(); })
      .catch(function () { S.adminBusy = false; render(); });
  }

  function addAdminNote(uid) {
    var e = document.getElementById("note_" + uid), v = e ? e.value.trim() : "";
    if (!v) return;
    adminAction("addNote", uid, { text: v });
  }

  // No per-founder uid on the wire for this one — target stays empty and
  // the new record travels as extra fields instead. See "addFounder" in
  // worker.js for the server-side validation this mirrors client-side.
  function addFounder() {
    var eEmail = document.getElementById("founderEmail"), eName = document.getElementById("founderName");
    var email = eEmail ? eEmail.value.trim().toLowerCase() : "";
    var name = eName ? eName.value.trim() : "";
    if (!email || email.indexOf("@") < 0 || !name) return;
    adminAction("addFounder", null, { email: email, name: name });
    if (eEmail) eEmail.value = "";
    if (eName) eName.value = "";
  }

  function mutate(act, id) {
    var c = creds();
    if (!c.uid) { S.tab = "add"; return render(); }
    return api("/update", { village: S.home, kind: S.tab, id: id, act: act,
                            uid: c.uid, tok: c.tok, name: c.name })
      .then(function (d) {
        if (!d || !d.ok) S.err = (d && d.error === "unavailable")
          ? TXT.errTaken : TXT.errActionFail;
        if (act === "del") S.open = null;
        refresh();
      })
      .catch(function () { S.err = TXT.errOfflineRetry; render(); });
  }

  /* ---------------- boot ---------------- */
  function api(path, body) {
    return fetch(API + path, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function (r) { return r.json(); });
  }

  /* ---------------- click / page-time tracking ----------------
     Anonymous, batched, best-effort. sid lives in sessionStorage so it
     survives the Google sign-in redirect (a real page reload) without
     surviving a closed tab or a new device — never written anywhere else,
     never sent to /profile, never joined against a uid. See /track in the
     Worker for what happens to this on arrival.

     Two kinds of events: a "view" per tab with how long it was open, and a
     "click" per meaningful interaction — piggybacked entirely on the
     data-tab / data-act / etc. attributes already on every button in this
     file, so instrumenting a new feature later needs zero extra tracking
     code as long as it follows the same data-* convention everything else
     already does. */
  var trackSid = (function () {
    try {
      var v = sessionStorage.getItem("bx:sid");
      if (!v) {
        v = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now());
        sessionStorage.setItem("bx:sid", v);
      }
      return v;
    } catch (e) { return String(Math.random()).slice(2); }
  })();
  var trackQueue = [], trackTabName = null, trackTabSince = 0, lastRenderedTab = null;

  function trackFlush(useBeacon) {
    if (!API || !trackQueue.length) return;
    var payload = JSON.stringify({ sid: trackSid, events: trackQueue.slice(0, 30) });
    trackQueue = [];
    try {
      if (useBeacon && navigator.sendBeacon) navigator.sendBeacon(API + "/track", payload);
      else fetch(API + "/track", { method: "POST", headers: { "Content-Type": "application/json" }, body: payload, keepalive: true }).catch(function () {});
    } catch (e) {}
  }

  // Closes out whichever tab was open (if any) and, unless tab is null
  // (used on hide/unload), opens the next one. Called once per render()
  // when S.tab has actually changed — see render() below.
  function trackView(tab) {
    var now = Date.now();
    if (trackTabName) trackQueue.push({ t: "view", label: trackTabName, ms: now - trackTabSince });
    trackTabName = tab; trackTabSince = now;
  }

  function trackClick(label) {
    trackQueue.push({ t: "click", label: label });
    if (trackQueue.length >= 20) trackFlush(false);
  }

  document.addEventListener("click", function (e) {
    var el = e.target.closest(
      "[data-tab],[data-nav],[data-act],[data-mact],[data-auth],[data-fact],[data-opt],[data-pick],#gAuth,#pubAll,#doProfile,#signOut,#bAdd"
    );
    if (!el) return;
    var d = el.dataset;
    var label = d.tab ? "tab:" + d.tab
      : d.nav ? "nav:" + d.nav
      : d.act ? "act:" + d.act
      : d.mact ? "mact:" + d.mact
      : d.auth ? "auth:" + d.auth
      : d.fact ? "fact:" + d.fact
      : d.opt ? "opt:" + d.opt
      : d.pick ? "pick"
      : el.id ? "id:" + el.id
      : null;
    if (label) trackClick(label.slice(0, 40));
  }, true);

  setInterval(function () { trackFlush(false); }, 20000);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") { trackView(null); trackFlush(true); }
  });
  window.addEventListener("pagehide", function () { trackView(null); trackFlush(true); });

  function creds() {
    return S.user ? { uid: S.user.uid, tok: S.user.tok, name: fullName(S.user) } : {};
  }

  function refresh() {
    if (!S.home) return;
    var c = creds();
    return api("/data", { village: S.home, uid: c.uid, tok: c.tok })
      .then(function (d) {
        if (d.authFailed) {
          S.authErr = TXT.errSessionExpired;
          S.user = null; save(K_USER, null);
          S.tab = "auth";
        }
        S.offers = d.offers || []; S.wants = d.wants || []; S.done = d.done || 0;
        S.approved = (d.me && d.me.verified && S.user) ? [S.user.uid] : [];
        if (S.user && d.me) {
          var wasFounder = S.user.founder;
          S.user.founder = d.me.founder || null;
          S.user.isOwner = !!d.me.isOwner;
          S.user.code = d.me.code || null;
          if (S.user.founder !== wasFounder) save(K_USER, S.user);
        }
        S.ready = true; applyDeepLink(); render();
      })
      .catch(function () { S.ready = true; S.err = TXT.errOffline; render(); });
  }

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && S.navOpen) { S.navOpen = false; render(); }
  });

  Promise.all([load(K_HOME), load(K_MINE), load(K_ME), load(K_USER),
               load(K_DRAFT), load(K_A2HS)]).then(function (r) {
    var dr = r[4];
    if (dr && typeof dr === "object" && Array.isArray(dr.batch)) {
      S.batch = dr.batch; S.mode = dr.mode || "offers";
      if (dr.me && typeof dr.me === "object") S.me = Object.assign(S.me, dr.me);
    }
    S.home = (typeof r[0] === "string" && r[0]) ? r[0] : null;
    S.mine = Array.isArray(r[1]) ? r[1] : [];
    if (r[2] && typeof r[2] === "object") S.me = Object.assign(S.me, r[2]);
    if (r[3] && typeof r[3] === "object" && r[3].uid) S.user = r[3];
    S.a2hsDismissed = r[5] === true;
    handleGoogleReturn();
    render(); refresh();
  });
})();
</script>

</body>
</html>
