<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أثر — تبادل الكتب المدرسية</title>
<link rel="icon" type="image/png" href="athar-logo.png">
<meta name="description" content="مبادرة أثر لتبادل الكتب المدرسية المستعملة في البعينة نجيدات.">
<meta name="theme-color" content="#3EA648">
<meta property="og:title" content="أثر — تبادل الكتب المدرسية">
<meta property="og:description" content="كتب مستعملة من الصف الأول حتى الثاني عشر. البعينة نجيدات.">
<meta property="og:type" content="website">
<style>
  html, body { margin: 0; padding: 0; background: #F4F5F1; }
  .preview {
    background: #2C7A34; color: #fff; font-family: 'Tajawal', system-ui, sans-serif;
    font-size: 13px; text-align: center; padding: 9px 14px; line-height: 1.6;
  }
</style>
</head>
<body>
<div id="root"></div>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@300;400;500;700&family=Space+Mono:wght@700&display=swap');

#root {
  /* ---------- the six ----------
     One green family, one neutral, one warning color. No blue, no second
     green tint, no mint — those were four competing hue families before.
     Anywhere a "lighter green background" is needed now, it's --green at
     low opacity (see --wash), not a seventh named color. */
  --green-d: #1E5636;   /* headings, body-safe text on paper (7.0:1) */
  --green:   #2E7D4F;   /* buttons, the logo itself — large text only (4.1:1) */
  --stone:   #6E5F51;   /* secondary text, borders (5.0:1) */
  --paper:   #EDE7DF;   /* background */
  --ink:     #2A3628;   /* body text (10.3:1) */
  --clay:    #B5562E;   /* errors and delete. nowhere else, ever. */

  /* Utility neutrals — not brand colors, just the grays a UI needs
     regardless of palette (a border has to be some pale tint of something). */
  --line: #D9D0C5;
  --dot:  #DED4C4;
  --wash: rgba(46, 125, 79, .10);   /* --green at 10% — replaces the old --mint */
  --wash-strong: rgba(46, 125, 79, .16);
  --teal: #1E5636;

  /* No `direction` here. It lives on <html dir="rtl"> so mixed Arabic/Latin
     runs inherit one document direction instead of each element declaring
     its own — the usual cause of scrambled numbers and Hebrew titles. */
  font-family: 'Tajawal', system-ui, sans-serif;
  /* Arabic connects and carries marks above and below the baseline, so it
     needs more leading than Latin at the same size. Never add letter-spacing
     — it severs the joins. */
  font-size: 16px;
  line-height: 1.7;
  color: var(--ink);
  background-color: var(--paper);
  background-image: radial-gradient(var(--dot) 1.4px, transparent 1.4px);
  background-size: 18px 18px;
  min-height: 100vh;
  padding-bottom: 56px;
  -webkit-font-smoothing: antialiased;
}
#root *, #root *::before, #root *::after { box-sizing: border-box; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px; }

.menuBtn {
  font-size: 22px; line-height: 1; background: #fff; border: 1.5px solid var(--line);
  border-radius: 10px; width: 44px; height: 44px; cursor: pointer; color: var(--green-d);
  flex-shrink: 0; margin-left: 10px; align-self: flex-start;
}
.menuBtn:hover { border-color: var(--green); }
.navScrim {
  position: fixed; inset: 0; background: rgba(34, 55, 42, .35); z-index: 40;
  animation: fadeIn .15s ease both;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.navDrawer {
  position: fixed; top: 0; bottom: 0; right: 0; width: min(300px, 84vw); z-index: 41;
  background: var(--paper); box-shadow: -8px 0 24px rgba(0,0,0,.12);
  display: flex; flex-direction: column; padding: 18px;
  animation: slideIn .18s ease both;
}
@keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
@media (prefers-reduced-motion: reduce) { .navScrim, .navDrawer { animation: none; } }
.navHead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.navClose {
  font-size: 18px; background: none; border: 1.5px solid var(--line); border-radius: 8px;
  width: 36px; height: 36px; cursor: pointer; color: var(--stone);
}
.navItem {
  display: block; width: 100%; text-align: right; font-family: 'Tajawal', sans-serif;
  font-size: 16px; font-weight: 500; color: var(--ink); text-decoration: none;
  background: none; border: none; border-bottom: 1px solid var(--line);
  padding: 15px 4px; cursor: pointer;
}
.navItem:hover { color: var(--green-d); }
.masthead {
  padding: 22px 0 16px; margin-bottom: 16px;
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 16px; flex-wrap: wrap;
}
.brand { display: block; line-height: 0; }
.brandRow { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }

.progChip {
  font-family: 'Space Mono', monospace; font-size: 12px; color: var(--green-d);
  background: var(--wash); border-radius: 20px; padding: 3px 10px; white-space: nowrap;
}
.progChip i { font-style: normal; opacity: .55; }
.goalBlock {
  display: flex; align-items: center; gap: 14px; background: var(--wash);
  border-radius: 14px; padding: 14px 16px; margin: 14px 0 18px;
}
.goalBlock p { margin: 0; font-size: 14px; line-height: 1.7; }
.goalBlock b { font-family: 'Space Mono', monospace; color: var(--green-d); font-size: 16px; }

/* ---------- per-page palettes ----------
   Same family throughout; only the surface tones shift. The shelf stays
   quietest so the books themselves carry the colour. */
.wrap {
  position: relative; background: var(--pageBg, transparent);
  transition: background .3s ease; min-height: 100vh;
}
@media (prefers-reduced-motion: reduce) { .wrap { transition: none; } }
/* Same neutral family throughout — each page shifts warmth slightly rather
   than introducing a new hue. Green stays the only accent anywhere. */
.pgShelf { --pageBg: #EDE7DF; --pageEdge: rgba(110,95,81,.14); }
.pgAdd   { --pageBg: #EFE9DC; --pageEdge: rgba(46,125,79,.16); }
.pgAbout { --pageBg: #E7E1D3; --pageEdge: rgba(30,86,54,.20); }

/* Edge pattern only — never behind body text. Terraced hillside lines,
   drawn as a repeating gradient so it costs nothing to load. */
.wrap::before, .wrap::after {
  content: ""; position: fixed; top: 0; bottom: 0; width: 46px;
  pointer-events: none; z-index: 0; opacity: .85;
  background-image: repeating-linear-gradient(
    -18deg, transparent 0 14px, var(--pageEdge) 14px 15px);
}
.wrap::before { inset-inline-start: 0; }
.wrap::after { inset-inline-end: 0; }
@media (max-width: 720px) { .wrap::before, .wrap::after { width: 18px; opacity: .6; } }
.wrap > * { position: relative; z-index: 1; }

.masthead h1 { color: var(--green-d); margin: 0; }

/* ---------- logo + progress ring ---------- */
.logoRing { flex-shrink: 0; overflow: visible; }
.logoRing .arc { transition: stroke-dashoffset 1s cubic-bezier(.25,.8,.35,1); }
@media (prefers-reduced-motion: reduce) { .logoRing .arc { transition: none; } }
.logoRing.complete .arc { stroke: var(--green-d); }
.cycleBadge {
  font-family: 'Space Mono', monospace; font-size: 9px; fill: #fff;
}
.progChip {
  font-family: 'Space Mono', monospace; font-size: 12px; color: var(--green-d);
  background: var(--wash); border-radius: 20px; padding: 3px 10px; white-space: nowrap;
}
.progChip i { font-style: normal; opacity: .55; }
.goalBlock {
  display: flex; align-items: center; gap: 14px; background: var(--wash);
  border-radius: 14px; padding: 14px 16px; margin: 14px 0 18px;
}
.goalBlock p { margin: 0; font-size: 14px; line-height: 1.7; }
.goalBlock b { font-family: 'Space Mono', monospace; color: var(--green-d); font-size: 16px; }
.masthead p .linkish { margin-inline-start: 6px; }
.topStatement {
  text-align: center; font-family: 'Cairo', sans-serif; font-weight: 800;
  font-size: 12px; color: var(--green-d); margin: 0; padding: 8px 10px 0;
  line-height: 1.5;
}
.topStatement b { font-family: 'Space Mono', monospace; font-weight: 700; }

/* ---------- about page: goals ---------- */
.goalsTitle {
  font-family: 'Cairo', sans-serif; font-weight: 800; font-size: 17px;
  color: var(--green-d); margin: 22px 0 10px;
}
.goalsList { margin: 0 0 4px; padding-inline-start: 22px; }
.goalsList li { font-size: 14.5px; line-height: 1.9; margin-bottom: 6px; color: var(--ink); }
.quote {
  margin: 18px 0; padding: 14px 18px; border-inline-start: 3px solid var(--green);
  background: var(--wash); border-radius: 0 10px 10px 0;
  font-family: 'Cairo', sans-serif; font-weight: 700; font-size: 15.5px;
  color: var(--green-d); line-height: 1.8;
}
.who { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
.whoName {
  font-family: 'Cairo', sans-serif; font-weight: 700; font-size: 17px;
  color: var(--green-d); margin-inline-end: 4px;
}
.tabs { display: flex; gap: 6px; margin-bottom: 18px; }
.tab {
  flex: 1; font-family: 'Cairo', sans-serif; font-size: 17px; font-weight: 600; padding: 15px 10px;
  background: #fff; border: 1.5px solid var(--line); border-radius: 12px;
  color: var(--stone); cursor: pointer; transition: background .15s, color .15s, border-color .15s;
}
.tab:hover { border-color: var(--ink); color: var(--ink); }
.tab.on { background: var(--green); border-color: var(--green); color: #fff; }
/* One rule so nothing can be tabbed to invisibly. --green-d rather than
   --green: the ring must be visible against the white cards too. */
#root a:focus-visible,
#root button:focus-visible,
#root select:focus-visible,
#root input:focus-visible,
#root label.picBtn:focus-within {
  outline: 3px solid var(--green-d); outline-offset: 2px; border-radius: 10px;
}

.catBar { display: flex; gap: 8px; margin-bottom: 12px; }
.cb {
  flex: 1; font-family: 'Cairo', sans-serif; font-size: 16px; font-weight: 600; padding: 13px 8px;
  background: #fff; border: 1.5px solid var(--line); border-radius: 12px;
  color: var(--stone); cursor: pointer;
}
.cb.on { background: var(--wash); border-color: var(--green); color: var(--green-d); }
.stamp.stat span { font-size: 14px; line-height: 1.3; text-align: center; }
.gradeWrap { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
.filterLbl {
  font-family: 'Cairo', sans-serif; font-weight: 700; font-size: 16px;
  color: var(--green-d); flex-shrink: 0;
}
.gradeRow { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; flex: 1; }
.gchip {
  flex: 0 0 auto; min-width: 50px; height: 50px;
  font-family: 'Space Mono', monospace; font-size: 17px;
  background: #fff; border: 1.5px solid var(--line); border-radius: 10px;
  color: var(--stone); cursor: pointer;
}
.gchip.on { background: var(--green); color: #fff; border-color: var(--green); }
.gchip.all { min-width: 68px; font-family: 'Tajawal', sans-serif; font-size: 15px; }
.selects { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.selects > * { flex: 1 1 150px; }

select, input, textarea {
  font-family: 'Tajawal', sans-serif; font-size: 16px; padding: 14px 15px;
  border: 1.5px solid var(--line); border-radius: 10px; background: #fff;
  color: var(--ink); width: 100%;
}
textarea { line-height: 1.7; resize: vertical; min-height: 90px; }
select:focus-visible, input:focus-visible, textarea:focus-visible { border-color: var(--ink); }

.scope { display: flex; gap: 6px; margin-bottom: 10px; }
.sc {
  flex: 1; font-family: 'Tajawal', sans-serif; font-size: 13.5px; padding: 9px 6px;
  background: #fff; border: 1.5px solid var(--line); border-radius: 10px; color: var(--stone); cursor: pointer;
}
.sc.on { border-color: var(--green); background: var(--wash); color: var(--green-d); font-weight: 700; }
.linkish {
  background: none; border: 0; padding: 0; margin-inline-start: 4px; cursor: pointer;
  font-family: 'Tajawal', sans-serif; font-size: 12.5px; color: var(--green);
  text-decoration: underline; text-underline-offset: 3px;
}
.flag.away { border-color: var(--stone); color: var(--stone); }
.shelf { display: grid; grid-template-columns: 1fr; gap: 12px; }
.spine {
  display: flex; flex-wrap: wrap; align-items: stretch; background: #fff; border: 1px solid var(--line);
  border-radius: 16px; overflow: hidden; animation: rise .26s ease both;
  cursor: pointer; min-height: 108px; transition: border-color .15s, transform .15s;
}
.spine:hover { border-color: var(--green); transform: translateY(-1px); }
@keyframes rise { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .spine { animation: none; } }
.band { width: 10px; flex: 0 0 10px; }
.stamp {
  flex: 0 0 74px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  border-inline-end: 1px solid var(--line); background: var(--wash); gap: 2px;
}
.stamp b { font-family: 'Space Mono', monospace; font-size: 30px; line-height: 1; color: var(--green-d); }
.stamp span { font-size: 13px; color: var(--green-d); font-family: 'Cairo', sans-serif; font-weight: 600; }
.body { flex: 1; padding: 16px 18px; min-width: 0; }
.body h3 { font-family: 'Cairo', sans-serif; font-size: 19px; font-weight: 600; margin: 0 0 4px; line-height: 1.35; }
.meta { font-size: 14px; color: var(--stone); display: flex; flex-wrap: wrap; gap: 3px 10px; }
.ago { color: var(--stone); opacity: .8; }
.flag { font-size: 12px; padding: 0 6px; border: 1px solid var(--clay); color: var(--clay); border-radius: 6px; }
.acts {
  display: flex; align-items: center; gap: 8px; padding: 10px 14px; flex: 1 1 100%;
  flex-wrap: wrap; justify-content: flex-start; border-top: 1px solid var(--line);
  background: var(--paper);
}
.note { font-size: 13.5px; color: var(--stone); }
.taken { opacity: .5; }
.taken .body h3 { text-decoration: line-through; }
/* Arrived from a shared WhatsApp link — say which listing they came for. */
.spine.lit { border-color: var(--green); box-shadow: 0 0 0 3px var(--wash); }

.btn {
  font-family: 'Tajawal', sans-serif; font-size: 15px; font-weight: 500; padding: 12px 16px;
  border-radius: 10px; cursor: pointer; border: 1.5px solid var(--green);
  background: var(--green); color: #fff; white-space: nowrap; text-decoration: none;
  display: inline-block;
}
.btn.ghost { background: transparent; color: var(--stone); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--green); color: var(--green-d); }
.btn.big { width: 100%; padding: 15px; font-size: 16px; font-family: 'Cairo', sans-serif; font-weight: 700; border-radius: 14px; }
.btn[disabled] { opacity: .45; cursor: default; }

.card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-bottom: 14px; }
.cardHead {
  font-family: 'Cairo', sans-serif; font-size: 14px; color: var(--stone);
  border-bottom: 1px solid var(--line); padding-bottom: 9px; margin-bottom: 14px;
}
.meDone {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: #fff; border: 1px solid var(--line); border-inline-start: 4px solid var(--green);
  border-radius: 14px; padding: 13px 15px; margin-bottom: 14px;
}
.meDone b { display: block; font-size: 14.5px; }
.meDone span { font-size: 12.5px; color: var(--stone); }
.picBtn {
  display: block; position: relative; overflow: hidden; text-align: center; cursor: pointer;
  border: 1.5px dashed var(--green); background: #FBFDFA; padding: 24px 12px;
  font-size: 14px; color: var(--stone); border-radius: 12px;
}
.picBtn:hover { border-color: var(--green); color: var(--green-d); }
.picBtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; font-size: 0; }
.picRow { display: flex; align-items: center; gap: 12px; }
.picRow img { width: 64px; height: 82px; object-fit: cover; border: 1px solid var(--line); }
.thumb {
  flex: 0 0 84px; width: 84px; background: #EDEEE9; border-inline-end: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center;
}
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.qlist { display: flex; flex-direction: column; }
.qrow { display: flex; align-items: center; gap: 9px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.qrow:last-child { border-bottom: 0; }
.dot { width: 7px; height: 26px; flex: 0 0 7px; }
.qpic { width: 26px; height: 34px; object-fit: cover; border: 1px solid var(--line); }
.qtxt { flex: 1; font-size: 13.5px; min-width: 0; }
.publish { background: var(--green-d); border-color: var(--green-d); }
.back { margin-bottom: 14px; }
.gate {
  background: var(--wash); border: 1.5px solid var(--green); border-radius: 14px;
  padding: 16px 18px; margin-bottom: 16px;
}
.gate b { display: block; font-family: 'Cairo', sans-serif; font-size: 16px; color: var(--green-d); }
.gate span { display: block; font-size: 14px; color: var(--stone); margin-top: 6px; }
.gateBtns { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.detail { background: #fff; border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
.dpic { width: 100%; height: 260px; display: flex; align-items: center; justify-content: center; }
.dpic img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
.dbody { padding: 22px; }
.dgrade {
  display: inline-block; font-family: 'Cairo', sans-serif; font-weight: 700; font-size: 17px;
  background: var(--wash); color: var(--green-d); border-radius: 10px; padding: 6px 16px; margin-bottom: 10px;
}
.dtitle { font-family: 'Cairo', sans-serif; font-size: 26px; margin: 0 0 18px; line-height: 1.3; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 0 0 20px; }
@media (min-width: 700px) { .facts { grid-template-columns: repeat(3, 1fr); } }
.facts dt { font-size: 14px; color: var(--stone); margin-bottom: 3px; }
.facts dd { margin: 0; font-size: 16px; font-weight: 500; }
.giver { border-top: 1px solid var(--line); padding-top: 18px; }
.glabel { font-size: 14px; color: var(--stone); margin-bottom: 6px; }
.gname { font-family: 'Cairo', sans-serif; font-size: 21px; color: var(--green-d); margin-bottom: 14px; }
.dacts { display: flex; flex-direction: column; gap: 10px; max-width: 420px; }
.dacts .btn { text-align: center; }
.dload { display: block; width: 40px; height: 40px; }
.owner { color: var(--teal); font-weight: 500; }
.ver {
  display: inline-block; white-space: nowrap;
  font-size: 10.5px; font-weight: 500; border: 1px solid var(--teal); color: var(--teal);
  border-radius: 6px; padding: 1px 6px; margin-inline-start: 6px; vertical-align: middle;
}
.pend {
  display: inline-block; white-space: nowrap;
  font-size: 11.5px; font-weight: 500; border: 1px dashed var(--stone); color: var(--stone);
  border-radius: 6px; padding: 1px 6px; margin-inline-start: 6px; vertical-align: middle;
}
.btn.ghost.active { border-color: var(--teal); color: var(--teal); font-weight: 700; }
.stat {
  border-inline-start: 3px solid var(--green); background: #fff; border-radius: 12px; padding: 11px 13px;
  font-size: 12.5px; color: var(--stone); margin-bottom: 14px; line-height: 1.6;
}
.stat.ok { border-inline-start-color: var(--teal); color: var(--teal); }
.vbtn { display: inline-block; margin-top: 10px; font-size: 14px; }
.codebox {
  font-family: 'Space Mono', monospace; font-size: 34px; letter-spacing: .18em;
  text-align: center; color: var(--green-d); background: var(--wash);
  border-radius: 14px; padding: 18px; margin-bottom: 14px;
}
.held { background: #FFFDF6; }
.held .band { opacity: .45; }
.note.done { color: var(--teal); font-weight: 500; }
.card h2 { font-family: 'Cairo', sans-serif; font-size: 19px; margin: 0 0 4px; }
.lead { margin: 0 0 16px; font-size: 13.5px; color: var(--stone); }
.field { margin-bottom: 14px; }
.field > .lbl { display: block; font-size: 14.5px; font-weight: 500; margin-bottom: 5px; }
.hint { font-size: 14px; color: var(--stone); margin-top: 6px; line-height: 1.6; }
.two { display: flex; gap: 10px; flex-wrap: wrap; }
.two > div { flex: 1 1 145px; }
.opts { display: flex; gap: 8px; flex-wrap: wrap; }
.opt {
  flex: 1 1 110px; border: 1.5px solid var(--line); padding: 11px; border-radius: 10px;
  font-size: 14px; cursor: pointer; text-align: center; background: #fff;
}
.opt.on { border-color: var(--green); background: var(--wash); color: var(--green-d); font-weight: 700; }
.notice { border-inline-start: 3px solid var(--green); background: var(--wash); border-radius: 10px; padding: 10px 12px; font-size: 14px; color: var(--stone); margin-bottom: 14px; line-height: 1.7; }
.empty { text-align: center; padding: 44px 20px; color: var(--stone); border: 1.5px dashed var(--line);
  border-radius: 16px; background: rgba(255,255,255,.7); font-size: 14px; }
.empty p { margin: 0 0 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 0 0 16px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; min-height: 40px;
  font-family: 'Tajawal', sans-serif; font-size: 14px; color: var(--ink);
  background: #fff; border: 1.5px solid var(--line); border-radius: 999px;
  padding: 6px 13px; cursor: pointer;
}
.chip:hover { border-color: var(--green-d); }
.chip b { display: inline; font-size: 17px; font-weight: 400; color: var(--stone); line-height: 1; margin: 0; }
.emptyActs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.emptyActs .btn.big { width: auto; min-width: 190px; }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {

  /* ---------------- storage ---------------- */
  // Real browser storage. The previous version of this used window.storage,
  // an API that only exists inside Claude's own artifact preview — it never
  // existed on the actual deployed site, so everything silently fell back to
  // a plain JS variable that resets on every page load. That's why a refresh
  // used to force a fresh sign-in every time: nothing was ever really saved.
  // localStorage is synchronous; wrapped in a resolved Promise so every
  // existing .then()-based call site keeps working unchanged.
  var mem = {};
  function load(key) {
    try {
      var raw = localStorage.getItem(key);
      return Promise.resolve(raw === null ? null : JSON.parse(raw));
    } catch (e) {
      return Promise.resolve(mem[key] === undefined ? null : mem[key]);
    }
  }
  function loadList(key) { return load(key).then(function (v) { return Array.isArray(v) ? v : []; }); }
  function save(key, val) {
    mem[key] = val;
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
    return Promise.resolve();
  }
  function drop(key) {
    delete mem[key];
    try { localStorage.removeItem(key); } catch (e) {}
    return Promise.resolve();
  }

    return "https://wa.me/" + p + "?text=" + encodeURIComponent(msg);

  /* ---------------- image ---------------- */
  function shrink(file, max, q) {
    return new Promise(function (res, rej) {
      var fr = new FileReader();
      fr.onerror = function () { rej(new Error("read")); };
      fr.onload = function () {
        var img = new Image();
        img.onerror = function () { rej(new Error("img")); };
        img.onload = function () {
          var w = img.width, h = img.height, r = Math.min(1, max / Math.max(w, h));
          var c = document.createElement("canvas");
          c.width = Math.round(w * r); c.height = Math.round(h * r);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          res(c.toDataURL("image/jpeg", q));
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

    // so sessions and profiles stored before the merge still resolve.
    if (typeof u === "string") return u.replace(/\s+/g, " ").trim();
    if (u.name) return String(u.name).replace(/\s+/g, " ").trim();
    return [u.first, u.father, u.family].filter(Boolean).join(" ").trim();

  function eff(r) {
    if (r.status === "done" || r.taken) return "done";
    if (API) return r.status || "open";
    if (r.status === "reserved") {
      if (Date.now() - (r.resAt || 0) > HOLD_HOURS * 3600000) return "open";
      return "reserved";
    }

  function isVer(uid) {

    // treated as verified. With API set, only the server's list counts.
    if (!API && S.user && uid === S.user.uid) return true;
    return !!uid && S.approved.indexOf(uid) > -1;

  // fallback in case that filtering ever changes.
  function sealedOf(r) { return API ? !!r.sealed : !verOf(r); }
  function isBlocked(uid) { return !!uid && S.blocked.indexOf(uid) > -1; }

  function signIn() {
    var g = function (id) { var e = document.getElementById(id); return e ? e.value.trim() : ""; };
    var mode = S.authMode;
    var u = { first: g("iFirst"), father: g("iFather"), family: g("iFamily"),

    u.name = [u.first, u.father, u.family].filter(Boolean).join(" ");

    var d = normPhone(u.phone);
    if (d.length < 12) { S.authErr = TXT.errPhone; return render(); }
    // All three boxes are required individually — not just "two words somewhere".
    if (mode === "signup" && (!u.first || !u.father || !u.family)) {
      S.authErr = TXT.errNameThree; return render();
    }
    if (u.pass.length < 6) {
      S.authErr = TXT.errPassShort; return render();
    }

    var tok = newTok();
    S.authErr = "";

    if (!API) {
      // Demo mode, no server: one account per phone is all we can fake locally.
      S.user = { uid: "p:" + d, tok: tok, phone: d, name: u.name,
                 first: u.first, father: u.father, family: u.family };
      S.draft = null; save(K_USER, S.user, false); return render();
    }

    S.busy = true; render();
    // The phone is a household, not a single account — the server assigns or
    // resolves which uid this is, we no longer guess it here.
    api("/session", { phone: d, tok: tok, mode: mode, pass: u.pass,
                      name: u.name, first: u.first, father: u.father, family: u.family,
                      village: S.home })
      .then(function (r) {
        S.busy = false;
        if (r.ok) return finishLogin(r.uid, tok, d, r.name || u.name);
        if (r.pickAccount) { S.pickList = r.accounts || []; render(); return; }
        if (r.noAccount) { S.authErr = TXT.errNoAccount; S.authMode = "signup"; }
        else if (r.badPass) S.authErr = TXT.errBadPass;
        else if (r.weakPass) S.authErr = TXT.errPassWeak;
        else if (r.dupPass) S.authErr = TXT.errDupPass;
        else if (r.phoneTaken) { S.authErr = TXT.errPhoneTaken; S.authMode = "signin"; }
        else if (r.needName) { S.authErr = TXT.errNeedName; S.authMode = "signup"; }
        else S.authErr = TXT.errGeneric;
        render();
      })
      .catch(function () { S.busy = false; S.authErr = TXT.errOffline; render(); });
  }

  /* ---------------- Google sign-in ----------------
     A full-page redirect to the Worker, which redirects to Google, which
     redirects back to the Worker, which redirects back here with the
     result in the URL — see handleGoogleReturn(). Nothing about this uses
     fetch(), so there's no response to await; the page just navigates away.

     If S.user is already set, uid/tok ride along so the Worker links this
     Google account to the account already signed in on this device instead
     of treating it as a fresh sign-in. */
  function googleAuth() {
    if (!API) { S.authErr = TXT.errGoogle; return render(); }
    var qs = S.user ? ("?uid=" + encodeURIComponent(S.user.uid) + "&tok=" + encodeURIComponent(S.user.tok)) : "";
    location.href = API + "/auth/google/login" + qs;

  // Last step of a first-time Google sign-in: Google already gave us a
  // name, but identity here still runs on a phone number confirmed over
  // WhatsApp, same as everyone. `lt` is the short-lived token the Worker
  // handed back in the redirect, proving which Google email this is for
  // without ever putting the email itself in the URL.
  function finishGooglePhone() {
    var g = function (id) { var e = document.getElementById(id); return e ? e.value.trim() : ""; };
    var name = g("iGName"), phone = g("iGPhone");
    S.draft = { name: name, phone: phone };

    var d = normPhone(phone);
    if (d.length < 12) { S.authErr = TXT.errPhone; return render(); }
    if (name.split(/\s+/).filter(Boolean).length < 2) { S.authErr = TXT.errNeedName; return render(); }

    var tok = newTok();
    S.authErr = ""; S.busy = true; render();
    api("/session", { phone: d, tok: tok, mode: "signupGoogle", lt: S.gPendingLt, name: name, village: S.home })
      .then(function (r) {
        S.busy = false;
        if (r.ok) { S.gPendingLt = ""; return finishLogin(r.uid, tok, d, r.name || name); }
        if (r.error === "expired") S.authErr = TXT.errGExpired;
        else if (r.phoneTaken) { S.authErr = TXT.errPhoneTaken; S.gPendingLt = ""; S.authMode = "signin"; }
        else if (r.needName) S.authErr = TXT.errNeedName;
        else S.authErr = TXT.errGeneric;
        render();
      })
      .catch(function () { S.busy = false; S.authErr = TXT.errOffline; render(); });

  // Reads ?glogin=/?glink= off the URL once at boot and clears them so a
  // page refresh doesn't replay a stale redirect. Mirrors what /auth/google/
  // callback in the Worker promises to send — see that file for the
  // contract. Returns true if it consumed something worth showing.
  function handleGoogleReturn() {
    var qs = new URLSearchParams(location.search);
    var g = qs.get("glogin"), gl = qs.get("glink");
    if (!g && !gl) return false;
    history.replaceState(null, "", location.pathname + location.hash);

    if (g === "ok") {
      var uid = qs.get("uid"), tok = qs.get("tok");
      S.user = { uid: uid, tok: tok, phone: uid ? uid.slice(2) : "", name: qs.get("name") || "" };
      S.pickList = null; S.draft = null;
      S.tab = S.batch.length ? "add" : (S.tab === "auth" ? "offers" : S.tab);
      save(K_USER, S.user, false);
      return true;
    }
    if (g === "needphone") {
      S.gPendingLt = qs.get("lt") || "";
      S.draft = { name: qs.get("name") || "", phone: "" };
      S.authMode = "gphone"; S.tab = "auth";
      return true;
    }
    if (g === "error") {
      S.authErr = TXT.errGoogle; S.tab = "auth"; S.authMode = "signin";
      return true;
    }
    // glink=ok: a device already signed in just linked its Google account.
    // The existing session is untouched, nothing else to do here.
    return true;
  }

             : TXT.leadSignIn) + '</p>';
    // Three required boxes: first name, father's name, family name.
    if (up) {
      h += '<div class="field two">' +
        '<div><label class="lbl" for="iFirst">' + TXT.lblFirst + '</label>' +
        '<input id="iFirst" autocomplete="given-name" value="' + esc(d.first || "") + '"></div>' +
        '<div><label class="lbl" for="iFather">' + TXT.lblFather + '</label>' +
        '<input id="iFather" value="' + esc(d.father || "") + '"></div></div>' +
        '<div class="field"><label class="lbl" for="iFamily">' + TXT.lblFamily + '</label>' +
        '<div class="hint" id="hName">' + TXT.hintFamily + '</div>' +
        '<input id="iFamily" autocomplete="family-name" aria-describedby="hName" value="' + esc(d.family || "") + '"></div>';
    }
    h += '<div class="field"><label class="lbl" for="iPhone">' + TXT.lblPhone + '</label>' +
      '<input id="iPhone" inputmode="tel" autocomplete="tel" aria-describedby="hPhone"' +
      ' value="' + esc(d.phone) + '" placeholder="' + TXT.phPhone + '">' +
      '<div class="hint" id="hPhone">' + TXT.hintPhone + '</div></div>';
    if (!rec) {
      h += '<div class="field"><label class="lbl" for="iPass">' + TXT.lblPass + '</label>' +
        '<input id="iPass" type="password" autocomplete="' + (up ? "new-password" : "current-password") + '"' +
        (up ? ' aria-describedby="hPass"' : '') + '>' +
        (up ? '<div class="hint" id="hPass">' + TXT.hintPassNew + '</div>' : '') + '</div>';
    }
    h += (S.authErr ? '<div class="err">' + esc(S.authErr) + '</div>' : '');
    if (up) h += '<div class="notice">' + TXT.noticeName + '</div>';
    h += '<button class="btn big" id="doIn"' + (S.busy ? " disabled" : "") + '>' +
      (S.busy ? TXT.btnSending : up ? TXT.btnSignUp : TXT.btnSignIn) + '</button>';
    // No self-serve reset: nothing is sent to anyone's phone. A founder clears
    // the account by hand after speaking to the person.
    if (!up) h += '<div class="hint">' + TXT.hintForgotPass + '</div>';
    h += '<button class="linkish" data-tab="contact" style="margin-top:10px">' + TXT.authTroubleLink + '</button>';
    h += '<div style="text-align:center;color:var(--stone);font-size:13px;margin:16px 0 12px">' + TXT.orDivider + '</div>' +
      '<button type="button" class="btn big ghost" id="gAuth"' + (S.busy ? " disabled" : "") + '>' + TXT.btnGoogle + '</button>';
    return h + '</div>';
  }

  // Shown right after a first-time Google sign-in, before the account
  // actually exists. Google already supplied a name, so this only asks for
  // the one thing it can't: a phone number, verified over WhatsApp exactly
  // like a normal signup, no password involved.
  function gPhoneView() {
    var d = S.draft || { name: "", phone: "" };
    return '<div class="card"><h2>' + TXT.h2GPhone + '</h2>' +
      '<p class="lead">' + TXT.leadGPhone + '</p>' +
      '<div class="field"><label class="lbl" for="iGName">' + TXT.lblFullName + '</label>' +
      '<input id="iGName" value="' + esc(d.name || "") + '"></div>' +
      '<div class="field"><label class="lbl" for="iGPhone">' + TXT.lblPhone + '</label>' +
      '<input id="iGPhone" inputmode="tel" autocomplete="tel" aria-describedby="hGPhone"' +
      ' value="' + esc(d.phone || "") + '" placeholder="' + TXT.phPhone + '">' +
      '<div class="hint" id="hGPhone">' + TXT.hintPhone + '</div></div>' +
      (S.authErr ? '<div class="err">' + esc(S.authErr) + '</div>' : '') +
      '<div class="notice">' + TXT.noticeName + '</div>' +
      '<button class="btn big" id="doGPhone"' + (S.busy ? " disabled" : "") + '>' +
      (S.busy ? TXT.btnSending : TXT.btnGComplete) + '</button></div>';
  }

  /* ---------------- header ---------------- */
  // Add a page by adding one line here — the drawer, the binding, and the
  // close-on-click all read from this list, nothing else to touch.
  var NAV_ITEMS = [
    { label: TXT.navHome, tab: "offers" },
    { label: TXT.navAbout, tab: "about" },
    { label: TXT.navContact, tab: "contact" },
    { label: TXT.navFeedback, tab: "feedback" }
  ];

  function navDrawer() {
    var items = NAV_ITEMS.map(function (it) {
      return it.href
        ? '<a class="navItem" href="' + esc(it.href) + '">' + esc(it.label) + '</a>'
        : '<button class="navItem" data-nav="' + esc(it.tab) + '">' + esc(it.label) + '</button>';
    }).join("");
    return '<div class="navScrim" id="navScrim"></div>' +
      '<nav class="navDrawer"><div class="navHead"><span class="brand">أثر</span>' +
      '<button class="navClose" id="navClose" aria-label="سكّر القائمة">✕</button></div>' +
      items + '</nav>';
  }

  /* ---------- logo + progress ring ----------
     The real logo lives at athar-logo.png, alongside this file. It's
     referenced once as an external image (browser-cached) rather than
     embedded as text, so the header markup doesn't carry a ~50KB base64
     blob on every single render.

     Past 100: the ring completes and locks to the deep-green "done" style
     rather than continuing to sweep — this is a placeholder decision, not
     a final one. If a second full cycle happens, a small number renders
     in the ring's centre-bottom instead of leaving nothing to show for it.
     Confirm with Mahmoud whether this is the right behaviour before relying
     on it past the first 100. */
  var LOGO_SRC = "athar-logo.png";
  var RING_R = 44;
  var RING_CIRC = 2 * Math.PI * RING_R; // ~276.46

  function logoRing(done, size) {
    var cycles = Math.floor(done / EXCHANGE_GOAL);
    var inCycle = done % EXCHANGE_GOAL;
    var pct = cycles > 0 ? 1 : Math.max(0, Math.min(1, inCycle / EXCHANGE_GOAL));
    var offset = RING_CIRC * (1 - pct);
    var complete = pct >= 1;
    var cx = 59, cy = 59, clipId = "ring" + Math.round(done);

    var cycleMark = cycles > 0
      ? '<circle cx="' + cx + '" cy="' + (cy + 34) + '" r="9" fill="var(--green-d)"/>' +
        '<text x="' + cx + '" y="' + (cy + 37) + '" text-anchor="middle" class="cycleBadge">×' + esc(cycles + 1) + '</text>'
      : '';

    return '<svg class="logoRing' + (complete ? ' complete' : '') + '" width="' + size + '" height="' + size +
      '" viewBox="0 0 118 118" role="img" aria-label="' + esc(done) + ' من ' + esc(EXCHANGE_GOAL) + ' كتاب انتقل من عيلة لعيلة">' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="52" fill="var(--paper)"/>' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="' + RING_R + '" fill="none" stroke="var(--stone)" stroke-width="8" opacity=".35"/>' +
      '<circle class="arc" cx="' + cx + '" cy="' + cy + '" r="' + RING_R + '" fill="none" stroke="var(--green)" ' +
      'stroke-width="8" stroke-linecap="round" stroke-dasharray="' + RING_CIRC.toFixed(2) + '" ' +
      'stroke-dashoffset="' + offset.toFixed(2) + '" transform="rotate(-90 ' + cx + ' ' + cy + ')"/>' +
      '<clipPath id="' + clipId + '"><circle cx="' + cx + '" cy="' + cy + '" r="34"/></clipPath>' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="34" fill="var(--paper)"/>' +
      '<image href="' + LOGO_SRC + '" x="27" y="27" width="64" height="64" ' +
      'clip-path="url(#' + clipId + ')" preserveAspectRatio="xMidYMid slice"/>' +
      cycleMark +
      '</svg>';
  }

  function head() {
    var n = S.ready ? S.offers.filter(function (o) { return eff(o) !== "done"; }).length : "—";
    var auth = S.user
      ? '<div class="who"><span class="whoName"><bdi>' + esc(firstWord(fullName(S.user))) + '</bdi></span>' +
        '<button class="btn ghost" id="signOut">' + TXT.signOut + '</button></div>'
      : '<div class="who">' +
        '<button class="btn" data-auth="signin">' + TXT.signIn + '</button>' +
        '<button class="btn ghost" data-auth="signup">' + TXT.signUp + '</button></div>';

    return (S.navOpen ? navDrawer() : "") +
      '<p class="topStatement">' + TXT.ctaBannerPrefix +
      '<b>' + esc(EXCHANGE_GOAL) + '</b>' + TXT.ctaBannerSuffix + '</p>' +
      '<header class="masthead">' +
      '<button class="menuBtn" id="menuBtn" aria-label="القائمة">☰</button>' +
      '<div><div class="brandRow">' + logoRing(S.done, 56) +
      '<h1>تبادل الكتب المدرسية</h1>' +
      '<span class="progChip" title="' + esc(S.done) + ' / ' + esc(EXCHANGE_GOAL) + '">' +
      esc(S.done % EXCHANGE_GOAL) + '<i>/' + esc(EXCHANGE_GOAL) + '</i></span></div>' +
      '<p>' + esc(vill(S.home).name) + ' · ' + n + ' كتاب متوفر الآن ' +
      '<button class="linkish" id="chgHome">' + TXT.changeVillage + '</button></p></div>' +
      auth + '</header>' +
      '<div class="tabs">' + tabBtn("offers", TXT.tabOffers) + tabBtn("wants", TXT.tabWants) +
      tabBtn("add", TXT.tabAdd) + '</div>';
  }

  function tabBtn(id, label) {
    var extra = (id === "add" && S.batch.length) ? " (" + S.batch.length + ")" : "";
    return '<button class="tab' + (S.tab === id ? " on" : "") + '" data-tab="' + id + '">' + label + extra + '</button>';
  }

  /* ---------------- browse ---------------- */
  function scopeBar() {
    var reg = vill(S.home).region;
    return '<div class="scope">' +
      '<button class="sc' + (S.scope === "village" ? " on" : "") + '" data-scope="village">' + esc(vill(S.home).name) + '</button>' +
      '<button class="sc' + (S.scope === "region" ? " on" : "") + '" data-scope="region">' + esc(reg) + '</button></div>';
  }
  function filters() {
    var h = scopeBar() +
      '<div class="catBar">' +
      '<button class="cb' + (S.cat === "book" ? " on" : "") + '" data-cat="book">' + TXT.filterBooks + '</button>' +
      '<button class="cb' + (S.cat === "stat" ? " on" : "") + '" data-cat="stat">' + TXT.filterStat + '</button>' +
      '</div>';
    if (S.cat === "stat") return h;
    h += '<div class="gradeWrap"><span class="filterLbl">' + TXT.lblGradeShort + '</span><div class="gradeRow"><button class="gchip all' + (S.grade === "all" ? " on" : "") + '" data-g="all">' + TXT.allGrades + '</button>';
    GRADES.forEach(function (g) { h += '<button class="gchip' + (S.grade === g ? " on" : "") + '" data-g="' + g + '">' + g + '</button>'; });
    h += '</div></div><div class="selects"><select id="fSub"><option value="all">' + TXT.allSubjects + '</option>';
    SUBJECTS.forEach(function (x) { h += '<option value="' + esc(x[0]) + '"' + (S.subject === x[0] ? " selected" : "") + '>' + esc(x[0]) + '</option>'; });
    h += '</select><select id="fSch"><option value="all">' + TXT.allSchools + '</option>';
    SCHOOLS.forEach(function (x) { h += '<option value="' + esc(x) + '"' + (S.school === x ? " selected" : "") + '>' + esc(x) + '</option>'; });
    h += '</select>';
    return h + '</div>';
  }

  function thumb(r) {
    if (!r.pic) return '<div class="band" style="background:' + colorOf(r.subject) + '"></div>';
    var src = picMem[r.id];
    return '<div class="band" style="background:' + colorOf(r.subject) + '"></div>' +
      '<div class="thumb" data-pic="' + r.id + '">' +
      (src ? '<img src="' + src + '" alt="غلاف ' + esc(r.subject) + '">' : '<span></span>') + '</div>';
  }

  function spine(r) {
    var away = r.village !== S.home;
    var msg = S.tab === "offers"
      ? "مرحبا، بخصوص " + r.kind + " " + r.subject + " للصف " + r.grade + " المعروض على صفحة تبادل الكتب."
      : "مرحبا، عندي " + r.kind + " " + r.subject + " للصف " + r.grade + " اللي بتدوّر عليه.";
    // Server-declared. The client never decides who owns a listing.
    var owned = API ? !!r.mine : !!(S.user && r.uid && r.uid === S.user.uid);
    var st0 = eff(r);
    var h = '<article class="spine' + (st0 === "done" ? " taken" : st0 === "reserved" ? " held" : "") +
      (S.focus === r.id ? " lit" : "") +
      '" data-lid="' + esc(r.id) + '" data-open="' + r.id + '">' + thumb(r) +
      (r.cat === "stat"
        ? '<div class="stamp stat"><span>' + TXT.statLabel + '</span></div>'
        : '<div class="stamp"><span>' + TXT.lblGradeShort + '</span><b>' + esc(r.grade) + '</b></div>') +
      // <bdi> isolates the title: a Hebrew or English name inside an Arabic line
      // otherwise drags its punctuation to the wrong end.
      '<div class="body"><h3>' + esc(r.subject) + (r.title ? " — <bdi>" + esc(r.title) + "</bdi>" : "") +
      (verOf(r)
        ? '<span class="ver" title="' + TXT.verifiedBadgeTip + '">' + TXT.verifiedBadge + '</span>'
        // In practice only the owner ever sees this badge now — everyone
        // else stops receiving the record at all until it's verified.
        : '<span class="pend" title="' + TXT.pendingBadgeTip + '">' + TXT.pendingBadge + '</span>') +
      '</h3><div class="meta">' +
      '<span>' + esc(r.kind) + '</span>' +
      (S.tab === "offers" ? '<span>' + TXT.conditionPrefix + esc(r.cond) + '</span>' : '') +
      '<span>' + esc(r.school) + '</span>' +
      '<span>' + (away ? esc(vill(r.village).name) : (r.handoff === "point" ? esc(PICKUP) : TXT.handoffDirect)) + '</span>' +
      '<span class="ago">' + esc(timeAgo(r.at)) + '</span>' +
      (away ? '<span class="flag away">' + TXT.flagAwayVillage + '</span>' : '') +
      (S.user && r.name ? '<span class="owner">' + esc(r.name) + '</span>' : '') +
      '</div></div><div class="acts">';

    var st = eff(r), holder = API ? !!r.held : (S.user && r.holder === S.user.uid);
    var wa = (r.phone && !away) ? '<a class="btn" href="' + esc(waLink(r.phone, msg)) + '" target="_blank" rel="noopener noreferrer">واتساب</a>' : '';
    var A = function (act, label, cls) {
      return '<button class="btn ' + (cls || "ghost") + '" data-act="' + act + '" data-id="' + r.id + '">' + label + '</button>';
    };

    if (st === "done") {
      h += '<span class="note done">' + TXT.doneStatus + '</span>';
    } else if (st === "reserved") {
      if (owned) {
        h += '<span class="note">' + TXT.reservedFor + esc(r.holderName || TXT.ownerUnknown) + '</span>' +
             (r.confOwner ? '<span class="note">' + TXT.waitingOther + '</span>' : A("okOwner", TXT.btnConfirmDelivered, "")) +
             A("release", TXT.btnCancelHold);
      } else if (holder) {
        h += wa + (r.confHolder ? '<span class="note">' + TXT.waitingOwner + '</span>' : A("okHolder", TXT.btnConfirmReceived, "")) +
             A("release", TXT.btnStepBack);
      } else {
        h += '<span class="note">' + TXT.reservedGeneric + '</span>';
      }
    } else {
      if (!S.user) h += '<button class="btn ghost" data-tab="add">' + TXT.btnSignInToSee + '</button>';
      else if (owned) h += '<span class="note">' + (r.handoff === "point" ? TXT.pickupPrefix + esc(PICKUP) : TXT.availableStatus) + '</span>';
      // On the shelf, but there is no number to hand out yet. Saying so beats
      // a reserve button that the Worker will refuse with 409.
      else if (sealedOf(r)) h += '<span class="note">' + TXT.waitingSeller + '</span>';
      else h += wa + (wa ? "" : '<span class="note">' + TXT.labelPickup + esc(PICKUP) + '</span>') +
                (S.tab === "offers" ? A("hold", TXT.btnReserve, "") : "");
    }
    // Distribution is WhatsApp groups and nothing else, so every listing can be
    // forwarded. Short label — the acts column is narrow at 375px.
    h += '<a class="btn ghost" href="' + esc(shareLink(r)) + '" target="_blank" rel="noopener noreferrer"' +
         ' aria-label="' + TXT.shareTitle + '" title="' + TXT.shareTitle + '">' + TXT.shareLabel + '</a>';
    if (owned) h += A("del", TXT.btnDelete);
    return h + '</div></article>';
  }

  function detailView() {
    var src = S.tab === "wants" ? S.wants : S.offers, r = null;
    for (var i = 0; i < src.length; i++) if (src[i].id === S.open) r = src[i];
    if (!r) { S.open = null; return listView(); }

    var st = eff(r), owned = API ? !!r.mine : false, holder = API ? !!r.held : false;
    var away = r.village !== S.home;
    var msg = "مرحبا، بخصوص " + r.kind + " " + r.subject + " للصف " + r.grade + " المعروض على صفحة تبادل الكتب.";
    var pic = picMem[r.id];

    var h = '<button class="btn ghost back" data-open="">' + TXT.linkBackToShelf + '</button>' +
      '<article class="detail">' +
      '<div class="dpic" style="background:' + colorOf(r.subject) + '">' +
      (r.pic ? (pic ? '<img src="' + pic + '" alt="">' : '<span class="dload" data-pic="' + r.id + '"></span>') : '') +
      '</div>' +
      '<div class="dbody">' +
      '<div class="dgrade">' + (r.cat === "stat" ? TXT.statLabel : TXT.lblGradeShort + " " + esc(r.grade)) + '</div>' +
      '<h2 class="dtitle">' + esc(r.subject) + (r.title ? ' — ' + esc(r.title) : '') +
      (verOf(r) ? '<span class="ver">' + TXT.verifiedBadge + '</span>'
                : '<span class="pend">' + TXT.pendingBadge + '</span>') + '</h2>' +
      '<dl class="facts">' +

      (S.tab === "offers" ? '<div><dt>' + TXT.factCondition + '</dt><dd>' + esc(r.cond) + '</dd></div>' : '') +
      '<div><dt>' + TXT.factSchool + '</dt><dd>' + esc(r.school) + '</dd></div>' +
      '<div><dt>' + TXT.factVillage + '</dt><dd>' + esc(vill(r.village).name) + '</dd></div>' +
      '<div><dt>' + TXT.factHandoff + '</dt><dd>' + (r.handoff === "point" ? esc(PICKUP) : TXT.handoffDirect) + '</dd></div>' +
      '<div><dt>' + TXT.factStatus + '</dt><dd>' + (st === "done" ? TXT.doneStatus : st === "reserved" ? TXT.reservedWord : TXT.availableStatus) + '</dd></div>' +
      '<div><dt>' + TXT.factPublished + '</dt><dd>' + esc(timeAgo(r.at)) + '</dd></div>' +
      '</dl>';

    if (r.desc) h += '<div class="giver" style="border-top:none;padding-top:6px">' +
      '<div class="glabel">' + TXT.factDesc + '</div>' +
      '<p class="lead" style="white-space:pre-wrap">' + esc(r.desc) + '</p></div>';

    h += '<div class="giver"><div class="glabel">' + TXT.ownerLabel + '</div>';
    if (!S.user) {
      h += '<p class="lead">' + TXT.detailNoContact + '</p>' +
           '<button class="btn big" data-tab="add">' + TXT.btnSignInOrUp + '</button>';
    } else {
      h += '<div class="gname">' + esc(r.name || TXT.ownerUnknown) + '</div>' +
           (r.holderName ? '<div class="lead">' + TXT.reservedFor + esc(r.holderName) + '</div>' : '');
      var A = function (a, t, c) {
        return '<button class="btn big ' + (c || "") + '" data-act="' + a + '" data-id="' + r.id + '">' + t + '</button>';
      };
      var wa = (r.phone && !away)
        ? '<a class="btn big" href="' + esc(waLink(r.phone, msg)) + '" target="_blank" rel="noopener noreferrer">' + TXT.btnContactWhatsapp + '</a>'
        : '<div class="lead">' + TXT.detailPickupOnly + esc(PICKUP) + '.</div>';
      h += '<div class="dacts">';
      if (st === "done") h += '<div class="lead">' + TXT.detailDelivered + '</div>';
      else if (owned) {
        if (st === "reserved") h += (r.confOwner ? '<div class="lead">' + TXT.detailWaitingOther + '</div>' : A("okOwner", TXT.btnConfirmDelivered)) + A("release", TXT.btnCancelHold, "ghost");
        else h += '<div class="lead">' + TXT.detailBookOwned + '</div>';
        h += A("del", TXT.btnDeleteListing, "ghost");
      } else if (holder) {
        h += wa + (r.confHolder ? '<div class="lead">' + TXT.detailWaitingOwner + '</div>' : A("okHolder", TXT.btnConfirmReceived)) + A("release", TXT.btnStepBack, "ghost");
      } else if (st === "reserved") {
        h += '<div class="lead">' + TXT.detailReservedByOther + '</div>';
      } else {
        h += wa + (S.tab === "offers" ? A("hold", TXT.btnReserve) : "");
      }
      h += '</div>';
    }
    return h + '</div></div></article>';
  }

  function listView() {
    var src = S.tab === "wants" ? S.wants : S.offers;
    var rows = src.filter(function (r) {
      return !isBlocked(r.uid) && eff(r) !== "done" &&
             ((S.cat === "stat") === (r.cat === "stat")) &&
             (S.cat === "stat" ||
             (S.grade === "all" || r.grade === S.grade) &&
             (S.subject === "all" || r.subject === S.subject) &&
             (S.school === "all" || r.school === S.school));
    });
    if (!S.ready) return '<div class="empty"><b>' + TXT.emptyLoading + '</b></div>';
    if (rows.length) return '<div class="shelf">' + rows.map(spine).join("") + '</div>';
    // Anything at all in this category, before the grade/subject filters?
    var inCat = src.filter(function (r) {
      return !isBlocked(r.uid) && ((S.cat === "stat") === (r.cat === "stat"));
    });
    var act = activeFilters();
    return (inCat.length && act.length) ? emptyFiltered(act) : emptyCold();
  }

  /* ---------------- empty states ----------------
     An empty shelf is never a dead end. On launch day the shelf really is
     empty, and "ما في كتب مطابقة — غيّر الفلتر" reads as "this site is
     broken", which is how thin marketplaces die. Each state says what
     happened and offers one way forward.
     ------------------------------------------------------------------ */
  var FILTER_LABELS = { grade: TXT.filterLabelGrade, subject: TXT.filterLabelSubject, school: TXT.filterLabelSchool };

  function activeFilters() {
    if (S.cat === "stat") return [];   // stationery carries no grade/subject
    var out = [];
    if (S.grade !== "all") out.push({ k: "grade", label: "الصف " + S.grade });
    if (S.subject !== "all") out.push({ k: "subject", label: S.subject });
    if (S.school !== "all") out.push({ k: "school", label: S.school });
    return out;
  }
  function clearFilter(k) {
    if (k === "all") { S.grade = "all"; S.subject = "all"; S.school = "all"; }
    else S[k] = "all";
  }
  function chips(list) {
    if (!list.length) return "";
    return '<div class="chips">' + list.map(function (f) {
      return '<button type="button" class="chip" data-clr="' + f.k + '" ' +
        'aria-label="شيل فلتر ' + esc(FILTER_LABELS[f.k] || f.k) + '">' +
        '<bdi>' + esc(f.label) + '</bdi><b aria-hidden="true">×</b></button>';
    }).join("") + '</div>';
  }

  function emptyCold() {
    var stat = S.cat === "stat", off = S.tab === "offers";
    var head = stat ? (off ? TXT.emptyStatOffersHead : TXT.emptyStatWantsHead)
                    : (off ? TXT.emptyBookOffersHead : TXT.emptyBookWantsHead);
    var line = off
      ? (stat ? TXT.emptyStatLine
              : TXT.emptyBookLine)
      : TXT.emptyWantsLine;
    var cta = stat ? TXT.ctaStat : off ? TXT.ctaBook : TXT.ctaWant;
    return '<div class="empty"><b>' + head + '</b><p>' + line + '</p>' +
      '<div class="emptyActs"><button type="button" class="btn big" data-post="' +
      (off ? "offers" : "wants") + '">' + cta + '</button></div></div>';
  }

  function emptyFiltered(list) {
    var bits = [];
    if (S.grade !== "all") bits.push(TXT.forGradePrefix + "<bdi>" + esc(S.grade) + "</bdi>");
    if (S.subject !== "all") bits.push(TXT.inPrefix + esc(S.subject));
    if (S.school !== "all") bits.push(TXT.inPrefix + esc(S.school));
    // Subject is the most restrictive filter in practice, so it is offered
    // first; fall through the rest in the same order.
    var culprit = S.subject !== "all" ? "subject"
                : S.school !== "all" ? "school" : "grade";
    var h = '<div class="empty"><b>' + TXT.noResultsPrefix + (bits.length ? bits.join(" ") : TXT.noFiltersFallback) + '.</b>' +
      chips(list) + '<div class="emptyActs">' +
      '<button type="button" class="btn big" data-clr="' + culprit + '">' + TXT.clearOneFilterPrefix +
      esc(FILTER_LABELS[culprit]) + '</button>';
    if (list.length > 1) h += '<button type="button" class="btn ghost" data-clr="all">' + TXT.clearAllFilters + '</button>';
    // The requests board earns its keep here during cold start: a parent who
    // finds nothing leaves a signal instead of leaving.
    if (S.tab === "offers") h += '<button type="button" class="btn ghost" data-wantit="1">' + TXT.askForThisBook + '</button>';
    return h + '</div></div>';
  }

  /* ---------------- add ---------------- */
  function opts(name, arr, cur) {
    return '<div class="opts">' + arr.map(function (v) {
      return '<div class="opt' + (cur === v ? " on" : "") + '" data-opt="' + name + '" data-val="' + esc(v) + '">' + esc(v) + '</div>';
    }).join("") + '</div>';
  }

  function meCard() {
    var m = S.me;
    if (!S.editMe) {
      return '<div class="meDone"><div><b>' + esc(S.user ? fullName(S.user) : TXT.noNameYet) + '</b>' +
        '<span>' + esc(m.school) + ' · ' + (m.handoff === "point" ? esc(PICKUP) : TXT.handoffDirect) + '</span></div>' +
        '<button class="btn ghost" id="editMe">' + TXT.btnEdit + '</button></div>';
    }
    var h = '<div class="card"><div class="cardHead">' + TXT.cardHeadDelivery + '</div>' +
      '<div class="field"><label class="lbl">' + TXT.lblSchool + '</label>' +
      (S.home === "buaine"
        ? '<select id="mSch">' + SCHOOLS.map(function (x) { return '<option' + (m.school === x ? " selected" : "") + '>' + esc(x) + '</option>'; }).join("") + '</select>'
        : '<input id="mSch" value="' + esc(m.school) + '" placeholder="' + TXT.phSchoolOther + '">') + '</div>' +
      '<div class="field"><label class="lbl">' + TXT.lblHandoff + '</label>' +
      opts("handoff", [TXT.handoffDirect, PICKUP], m.handoff === "point" ? PICKUP : TXT.handoffDirect) +
      '<div class="hint">' + TXT.hintHandoff + '<br>' +
      esc(PICKUP) + TXT.hintHandoffPointSuffix + '</div></div>' +
      '<button class="btn ghost" id="doneMe">' + TXT.btnDone + '</button>';
    return h + '</div>';
  }

  function bookCard() {
    var b = S.b, off = S.mode === "offers", st = b.cat === "stat";
    var h = '<div class="card">' +
      '<div class="cardHead">' + (st ? TXT.cardHeadStat : TXT.cardHeadBook) +
      (S.batch.length ? TXT.numberLabel + (S.batch.length + 1) : "") + '</div>' +
      '<div class="field">' + opts("cat", [TXT.filterBooks, STAT], st ? STAT : TXT.filterBooks) + '</div>' +
      (st ? "" : '<div class="field two"><div><label class="lbl">' + TXT.lblGradeShort + '</label><select id="bG">' +
      GRADES.map(function (g) { return '<option' + (b.grade === g ? " selected" : "") + '>' + g + '</option>'; }).join("") +
      '</select></div><div><label class="lbl">' + TXT.lblSubject + '</label><select id="bS">' +
      SUBJECTS.map(function (x) { return '<option' + (b.subject === x[0] ? " selected" : "") + '>' + esc(x[0]) + '</option>'; }).join("") +
      '</select></div></div>') +
      "";
    if (off) h += '<div class="field"><label class="lbl">' + (st ? TXT.lblCondition : TXT.lblConditionBook) + '</label>' + opts("cond", CONDS, b.cond) + '</div>';
    h += '<div class="field"><label class="lbl">' + (st ? TXT.lblTitleStat : TXT.lblTitleBook) + '</label>' +
      '<input id="bT" value="' + esc(b.title) + '" placeholder="' + (st ? TXT.phTitleStat : TXT.phTitleBook) + '"></div>' +
      '<div class="field"><label class="lbl" for="bD">' + TXT.lblDesc + '</label>' +
      '<textarea id="bD" rows="3" placeholder="' + esc(TXT.phDesc) + '">' + esc(b.desc || "") + '</textarea></div>' +
      '<div class="field"><label class="lbl">' + (st ? TXT.lblPhotoStat : TXT.lblPhotoBook) + '</label>' +
      (b.pic
        ? '<div class="picRow"><img src="' + b.pic + '" alt="معاينة الغلاف"><button class="btn ghost" id="rmPic">' + TXT.btnRemovePhoto + '</button></div>'
        : '<label class="picBtn">' + TXT.btnPickPhoto + '<input type="file" accept="image/*" capture="environment" id="bPic"></label>') +
      '<div class="hint">' + TXT.hintPhoto + '</div></div>' +
      '<button class="btn big" id="bAdd">' + (st ? TXT.btnAddStat : TXT.btnAddBook) + '</button></div>';
    return h;
  }

  function batchCard() {
    if (!S.batch.length) return "";
    var h = '<div class="card"><div class="cardHead">' + TXT.queueHeadPrefix + S.batch.length + TXT.queueHeadSuffix + '</div><div class="qlist">';
    S.batch.forEach(function (b, i) {
      h += '<div class="qrow"><span class="dot" style="background:' + colorOf(b.subject) + '"></span>' +
        (b.pic ? '<img class="qpic" src="' + b.pic + '" alt="">' : '') +
        '<span class="qtxt">' + esc(b.subject) + TXT.gradeLabel + esc(b.grade) + (b.title ? ' · ' + esc(b.title) : '') + '</span>' +
        '<button class="linkish" data-rm="' + i + '">' + TXT.linkRemove + '</button></div>';
    });
    return h + '</div></div>';
  }

  function addView() {
    var off = S.mode === "offers";
    var gate = !S.user
      ? '<div class="gate"><b>' + TXT.gateSignInTitle + '</b>' +
        '<div class="gateBtns"><button class="btn" data-auth="signin">' + TXT.signIn + '</button>' +
        '<button class="btn ghost" data-auth="signup">' + TXT.signUp + '</button></div></div>'
      // Submission is never blocked — a mother who clears a shelf at 9pm
      // shouldn't be told to come back later. What she posts now is saved
      // immediately, visible to her, and invisible to everyone else until a
      // founder verifies her account — at which point it appears with no
      // extra step from her.
      : !isVer(S.user.uid)
        ? '<div class="gate"><b>' + TXT.gatePendingTitle + '</b>' +
          '<span>' + TXT.gatePendingBody + '</span></div>'
        : "";
    var h = gate +
      '<div class="field">' + opts("mode", [TXT.modeOffer, TXT.modeWant], off ? TXT.modeOffer : TXT.modeWant) + '</div>' +
      meCard() + bookCard() + batchCard();
    if (S.err) h += '<div class="err">' + esc(S.err) + '</div>';
    if (S.batch.length) {
      h += '<button class="btn big publish" id="pubAll"' + (S.busy ? " disabled" : "") + '>' +
        (S.busy ? esc(S.progress || TXT.btnPublishing) : TXT.btnPublish + S.batch.length + (off ? TXT.unitBook : TXT.unitWant)) + '</button>';
    }
    return h;
  }

  /* ---------------- village picker ---------------- */
  function homeView() {
    var byReg = {}, order = [];
    VILLAGES.forEach(function (v) {
      if (!byReg[v.region]) { byReg[v.region] = []; order.push(v.region); }
      byReg[v.region].push(v);
    });
    var h = '<div class="wrap"><header class="masthead"><div><span class="brand">أثر</span><h1>تبادل الكتب المدرسية</h1>' +
      '<p>اختر بلدك. بتقدر تغيّرها بعدين.</p></div></header><div class="card">' +
      '<h2>' + TXT.h2PickHome + '</h2><p class="lead">' + TXT.leadPickHome + '</p>';
    order.forEach(function (r) {
      h += '<div class="field"><label class="lbl">' + esc(r) + '</label><div class="opts">' +
        byReg[r].map(function (v) { return '<div class="opt" data-home="' + v.code + '">' + esc(v.name) + '</div>'; }).join("") +
        '</div></div>';
    });
    return h + '</div></div>';
  }

  /* ---------------- render ---------------- */
  function render() {
    if (!S.home) { root.innerHTML = homeView(); bind(); return; }
    // Page-scoped palette + pattern. Each page overrides a few tokens so
    // moving between them feels like rooms in one house.
    var pageCls = S.tab === "add" ? "pgAdd" : S.tab === "about" ? "pgAbout"
                : S.tab === "contact" ? "pgAbout" : S.tab === "feedback" ? "pgAbout" : "pgShelf";
    root.innerHTML = '<div class="wrap ' + pageCls + '">' + head() +
      (S.tab === "auth" ? authView()
        : S.tab === "about" ? aboutView()
        : S.tab === "contact" ? contactView()
        : S.tab === "feedback" ? feedbackView()
        : S.tab === "add" ? addView()
        : S.open ? detailView()
        : (S.linkMiss
             ? '<div class="notice">الكتاب اللي وصلك رابطه ما عاد موجود — يمكن حدا أخده. ' +
               'تحت كل الكتب المتوفرة حاليًا.</div>'
             : '') + filters() + listView()) +
      '<p class="foot">اللي بتكتبه بيظهر لكل من بيفتح الصفحة. لا تنشر رقم تلفون طالب قاصر.' +
      '<br><button class="linkish" data-tab="contact">تواصل معنا</button>' +
      // This warned about temporary storage whenever window.storage was missing
      // — which is always, in a real browser. It showed on the live site even
      // with the Worker wired up. The real condition is "no API".
      (API ? "" : "<br>الإعلانات محفوظة مؤقتًا فقط — لازم تربط قاعدة بيانات قبل الإطلاق.") +
      '</p></div>';
    bind();
    fetchPics();
    highlight();
  }

  function fetchPics() {
    var want = [];
    root.querySelectorAll("[data-pic]").forEach(function (el) {
      var id = el.dataset.pic;
      if (!picMem[id] && !picWanted[id]) { picWanted[id] = 1; want.push(id); }
    });
    if (!want.length) return;
    var i = 0;
    (function next() {
      if (i >= want.length) return;
      var id = want[i++];
      (API
        ? fetch(API + "/pic?id=" + encodeURIComponent(id)).then(function (r) { return r.ok ? r.json() : null; })
            .then(function (o) { return o ? o.value : null; }).catch(function () { return null; })
        : load(kPic(id), true)
      ).then(function (v) {
        if (typeof v === "string" && v) {
          picMem[id] = v;
          var el = root.querySelector('[data-pic="' + id + '"]');
          if (el) el.innerHTML = '<img src="' + v + '" alt="">';
        }
        next();
      });
    })();
  }

  /* ---------------- reads ---------------- */
  function readMe() {
    var c = document.getElementById("mSch"); if (c) S.me.school = c.value;
  }
  function readBook() {
    var g = document.getElementById("bG"); if (g) S.b.grade = g.value;
    var s = document.getElementById("bS"); if (s) S.b.subject = s.value;
    var t = document.getElementById("bT"); if (t) S.b.title = t.value;
    var ds = document.getElementById("bD"); if (ds) S.b.desc = ds.value;
  }

  /* ---------------- events ---------------- */
  function bind() {
    root.querySelectorAll("[data-home]").forEach(function (b) {
      b.onclick = function () { S.home = b.dataset.home; save(K_HOME, S.home, false); render(); refresh(); };
    });
    root.querySelectorAll("[data-auth]").forEach(function (b) {
      b.onclick = function () {
        S.authMode = b.dataset.auth; S.authErr = ""; S.tab = "auth";
        window.scrollTo(0, 0); render();
      };
    });
    var mb = document.getElementById("menuBtn");
    if (mb) mb.onclick = function () { S.navOpen = true; render(); };
    var nc = document.getElementById("navClose");
    if (nc) nc.onclick = function () { S.navOpen = false; render(); };
    var scrim = document.getElementById("navScrim");
    if (scrim) scrim.onclick = function () { S.navOpen = false; render(); };
    root.querySelectorAll("[data-nav]").forEach(function (b) {
      b.onclick = function () {
        S.navOpen = false; S.tab = b.dataset.nav; S.open = null;
        window.scrollTo(0, 0); render();
      };
    });

    var ch = document.getElementById("chgHome");
    if (ch) ch.onclick = function () { S.home = null; S.ready = false; render(); };

    root.querySelectorAll("[data-scope]").forEach(function (b) {
      b.onclick = function () { S.scope = b.dataset.scope; S.ready = false; render(); refresh(); };
    });
    root.querySelectorAll("[data-tab]").forEach(function (b) {
      b.onclick = function () { S.tab = b.dataset.tab; S.err = ""; render(); };
    });
    root.querySelectorAll("[data-g]").forEach(function (b) {
      b.onclick = function () { S.grade = b.dataset.g; render(); };
    });
    root.querySelectorAll("[data-cat]").forEach(function (b) {
      b.onclick = function () { S.cat = b.dataset.cat; S.open = null; render(); };
    });
    var sub = document.getElementById("fSub"); if (sub) sub.onchange = function () { S.subject = sub.value; render(); };
    var sch = document.getElementById("fSch"); if (sch) sch.onchange = function () { S.school = sch.value; render(); };
    root.querySelectorAll("[data-open]").forEach(function (el) {
      el.onclick = function (e) {
        if (e.target.closest("button, a") && e.target.closest("[data-open]") !== e.target) {
          if (el.tagName !== "BUTTON") return;
        }
        S.open = el.dataset.open || null;
        window.scrollTo(0, 0);
        render();
      };
    });
    // Empty-state escape hatches.
    root.querySelectorAll("[data-clr]").forEach(function (b) {
      b.onclick = function () { clearFilter(b.dataset.clr); render(); };
    });
    root.querySelectorAll("[data-post]").forEach(function (b) {
      b.onclick = function () { S.mode = b.dataset.post; S.tab = "add"; S.err = ""; render(); };
    });
    root.querySelectorAll("[data-wantit]").forEach(function (b) {
      b.onclick = function () {
        // Carry the filters already set into the request form, so "there is no
        // grade 7 maths book" turns into a request for one.
        S.mode = "wants"; S.batch = [];
        if (S.grade !== "all") S.b.grade = S.grade;
        if (S.subject !== "all") S.b.subject = S.subject;
        S.tab = "add"; S.err = ""; render();
      };
    });
    root.querySelectorAll("[data-act]").forEach(function (b) {
      b.onclick = function () { mutate(b.dataset.act, b.dataset.id); };
    });

    root.querySelectorAll("[data-opt]").forEach(function (o) {
      o.onclick = function () {
        readMe(); readBook();
        var n = o.dataset.opt, v = o.dataset.val;
        if (n === "authMode") { S.authMode = (v === TXT.signUp) ? "signup" : "signin"; S.authErr = ""; }
        else if (n === "mode") { S.mode = (v === "عندي كتب") ? "offers" : "wants"; S.batch = []; }
        else if (n === "handoff") S.me.handoff = (v === PICKUP) ? "point" : "direct";
        else if (n === "cat") S.b.cat = (v === STAT) ? "stat" : "book";
        else if (n === "cond") S.b.cond = v;
        render();
      };
    });

    var di = document.getElementById("doIn"); if (di) di.onclick = signIn;
    var ga = document.getElementById("gAuth"); if (ga) ga.onclick = googleAuth;
    var dgp = document.getElementById("doGPhone"); if (dgp) dgp.onclick = finishGooglePhone;
    root.querySelectorAll("[data-pick]").forEach(function (b) {
      b.onclick = function () { signInAs(b.dataset.pick); };
    });
    var cpk = document.getElementById("cancelPick");
    if (cpk) cpk.onclick = function () { S.pickList = null; render(); };
    var sp = document.getElementById("savePass"); if (sp) sp.onclick = savePass;
    var so = document.getElementById("signOut"); if (so) so.onclick = signOut;

    var em = document.getElementById("editMe"); if (em) em.onclick = function () { S.editMe = true; render(); };
    var dm = document.getElementById("doneMe"); if (dm) dm.onclick = function () { readMe(); S.editMe = false; render(); };

    var pic = document.getElementById("bPic");
    if (pic) pic.onchange = function () {
      var f = pic.files && pic.files[0];
      if (!f) return;
      readMe(); readBook();
      shrink(f, 520, 0.6).then(function (d) { S.b.pic = d; render(); })
        .catch(function () { S.err = TXT.errPhotoOpen; render(); });
    };
    var rm = document.getElementById("rmPic");
    if (rm) rm.onclick = function () { readMe(); readBook(); S.b.pic = ""; render(); };

    var ad = document.getElementById("bAdd"); if (ad) ad.onclick = addToBatch;
    root.querySelectorAll("[data-rm]").forEach(function (b) {
      b.onclick = function () { readMe(); readBook(); S.batch.splice(+b.dataset.rm, 1); saveDraft(); render(); };
    });
    var pa = document.getElementById("pubAll"); if (pa) pa.onclick = publishAll;

    var sf = document.getElementById("sendFeedback");
    if (sf) sf.onclick = function () {
      var t = document.getElementById("fbText"), v = t ? t.value.trim() : "";
      if (!v) { S.err = TXT.feedbackErrEmpty; return render(); }
      S.err = "";
      window.open(waLink(CONTACT_PHONE, "ملاحظة على صفحة أثر:\n" + v), "_blank", "noopener,noreferrer");
    };
  }

  function addToBatch() {
    readMe(); readBook();

    if (!S.b.title.trim() && !S.b.pic) {
      S.err = TXT.errTitleOrPhoto; return render();
    }
    if (S.batch.length >= MAX_BATCH) { S.err = TXT.errBatchFull; return render(); }

    // The book is banked before anyone is sent to sign in, so nothing is
    // retyped afterwards.
    S.err = "";
    S.batch.push({ cat: S.b.cat,
                   grade: S.b.cat === "stat" ? "" : S.b.grade,
                   subject: S.b.cat === "stat" ? STAT : S.b.subject,
                   kind: "كتاب", title: S.b.title.trim(), cond: S.b.cond, pic: S.b.pic,
                   desc: (S.b.desc || "").trim() });
    S.b.title = ""; S.b.pic = ""; S.b.desc = "";
    saveDraft();
    save(K_ME, S.me, false);

    if (!S.user) { S.tab = "auth"; S.authMode = "signin"; window.scrollTo(0, 0); }
    render();
  }

  function publishAll() {
    readMe(); readBook();
    if (!S.user) { S.tab = "auth"; S.authMode = "signin"; window.scrollTo(0, 0); return render(); }
    // No verification check here — the Worker accepts publishes from unapproved
    // accounts by design and seals their contact details instead.
    S.busy = true; S.err = ""; S.progress = TXT.btnPublishing; render();

    if (API) {
      var c = creds(), pics = {};
      S.batch.forEach(function (b, i) { if (b.pic) pics[String(i)] = b.pic; });
      return api("/publish", {
        village: S.home, kind: S.mode, uid: c.uid, tok: c.tok, name: c.name,
        records: S.batch.map(function (b) {
          return { cat: b.cat, grade: b.grade, subject: b.subject, kind: b.kind, title: b.title,
                   cond: b.cond, desc: b.desc || "", school: S.me.school, handoff: S.me.handoff };
        }),
        pics: pics
      }).then(function (d) {
        S.busy = false; S.progress = "";
        if (d && d.ok) { S.batch = []; saveDraft(); S.tab = S.mode; }
        else if (d && d.error === "blocked") S.err = TXT.errBlocked;
        else S.err = TXT.errPublishFail;
        render(); refresh();
      }).catch(function () {
        S.busy = false; S.err = TXT.errOffline; render();
      });
    }

    var key = kOf(S.mode, S.home), now = Date.now();
    var recs = S.batch.map(function (b, i) {
      return {
        id: (now + i).toString(36) + Math.random().toString(36).slice(2, 7),
        village: S.home, uid: S.user.uid, cat: b.cat === "stat" ? "stat" : "book",
        grade: b.grade, subject: b.subject, kind: b.kind,
        title: b.title, cond: b.cond, desc: b.desc || "", school: S.me.school, handoff: S.me.handoff,
        name: fullName(S.user), phone: S.me.handoff === "direct" ? S.user.phone : "",
        pic: !!b.pic, at: now + i, status: "open", holder: "", holderName: "",
        resAt: 0, confOwner: false, confHolder: false
      };
    });

    var pics = [], k = 0;
    recs.forEach(function (r, i) { if (S.batch[i].pic) { picMem[r.id] = S.batch[i].pic; pics.push([r.id, S.batch[i].pic]); } });

    (function nextPic() {
      if (k < pics.length) {
        S.progress = "جاري رفع الصور " + (k + 1) + "/" + pics.length; render();
        var pr = pics[k++];
        return save(kPic(pr[0]), pr[1], true).then(nextPic);
      }
      loadList(key).then(function (latest) {
        return save(key, recs.concat(latest), true);
      }).then(function () {
        S.mine = S.mine.concat(recs.map(function (r) { return r.id; }));
        return save(K_MINE, S.mine, false);
      }).then(function () {
        S.busy = false; S.progress = ""; S.batch = []; saveDraft(); S.tab = S.mode;
        render(); refresh();
      });
    })();
  }

  function mutate(act, id) {
    if (API) {
      var c = creds();
      if (!c.uid) { S.tab = "add"; return render(); }
      return api("/update", { village: S.home, kind: S.tab, id: id, act: act,
                              uid: c.uid, tok: c.tok, name: c.name })
        .then(function (d) {
          if (!d || !d.ok) S.err = (d && d.error === "unavailable")
            ? TXT.errTaken : TXT.errActionFail;
          if (act === "del") S.open = null;
          refresh();
        })
        .catch(function () { S.err = TXT.errOfflineRetry; render(); });
    }

    var src = S.tab === "offers" ? S.offers : S.wants, rec = null;
    for (var i = 0; i < src.length; i++) if (src[i].id === id) rec = src[i];
    if (!rec) return;
    var key = kOf(S.tab, rec.village);

    loadList(key).then(function (latest) {
      var next;
      if (act === "del") {
        next = latest.filter(function (x) { return x.id !== id; });
      } else {
        next = latest.map(function (x) {
          if (x.id !== id) return x;
          var r = Object.assign({}, x);
          if (act === "hold") {
            if (eff(x) === "reserved") return x;          // someone got there first
            r.status = "reserved"; r.resAt = Date.now();
            r.holder = S.user.uid; r.holderName = fullName(S.user);
            r.confOwner = false; r.confHolder = false;
          } else if (act === "release") {
            r.status = "open"; r.holder = ""; r.holderName = "";
            r.resAt = 0; r.confOwner = false; r.confHolder = false;
          } else if (act === "okHolder") {
            r.confHolder = true;
          } else if (act === "okOwner") {
            r.confOwner = true; r.status = "done"; r.doneAt = Date.now();
          }
          return r;
        });
      }
      return save(key, next, true).then(function () {
        if (act === "del" && rec.pic) { delete picMem[id]; return drop(kPic(id), true); }
      });
    }).then(refresh);
  }

  /* ---------------- boot ---------------- */
  function codes() {
    if (S.scope === "village") return [S.home];
    var reg = vill(S.home).region;
    return VILLAGES.filter(function (v) { return v.region === reg; }).map(function (v) { return v.code; });
  }
  function api(path, body) {
    return fetch(API + path, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function (r) { return r.json(); });
  }
  function creds() {
    return S.user ? { uid: S.user.uid, tok: S.user.tok, name: fullName(S.user) } : {};
  }

  function fetchList(path, fallbackKey) {
    if (!API) return loadList(fallbackKey);
    return fetch(API + path, { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (v) { return Array.isArray(v) ? v : []; })
      .catch(function () { return loadList(fallbackKey); });
  }

  function refresh() {
    if (!S.home) return;

    if (API) {
      var c = creds();
      return api("/data", { village: S.home, uid: c.uid, tok: c.tok })
        .then(function (d) {
          if (d.authFailed) {
            S.authErr = TXT.errSessionExpired;
            S.user = null; save(K_USER, null, false);
            S.tab = "auth"; S.authMode = "signin";
          }
          S.offers = d.offers || []; S.wants = d.wants || []; S.done = d.done || 0;
          S.approved = (d.me && d.me.verified && S.user) ? [S.user.uid] : [];
          S.ready = true; applyDeepLink(); render();
        })
        .catch(function () { S.ready = true; S.err = TXT.errOffline; render(); });
    }

    var cs = codes();
    Promise.all([
      Promise.all(cs.map(function (c) { return loadList(kOf("offers", c)); })),
      Promise.all(cs.map(function (c) { return loadList(kOf("wants", c)); })),
      fetchList("/approved", K_APPROVED), fetchList("/blocked", K_BLOCKED)
    ]).then(function (r) {
      var flat = function (a) { return a.reduce(function (x, y) { return x.concat(y); }, []); };
      S.approved = r[2]; S.blocked = r[3];
      S.offers = flat(r[0]).sort(function (a, b) { return b.at - a.at; });
      S.wants = flat(r[1]).sort(function (a, b) { return b.at - a.at; });
      S.ready = true; applyDeepLink(); render();
    });
  }

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && S.navOpen) { S.navOpen = false; render(); }
  });

  Promise.all([load(K_HOME, false), load(K_MINE, false), load(K_ME, false), load(K_USER, false),
               load(K_DRAFT, false)]).then(function (r) {
    var dr = r[4];
    if (dr && typeof dr === "object" && Array.isArray(dr.batch)) {
      S.batch = dr.batch; S.mode = dr.mode || "offers";
      if (dr.me && typeof dr.me === "object") S.me = Object.assign(S.me, dr.me);
    }
    S.home = (typeof r[0] === "string" && r[0]) ? r[0] : null;
    S.mine = Array.isArray(r[1]) ? r[1] : [];
    if (r[2] && typeof r[2] === "object") S.me = Object.assign(S.me, r[2]);
    if (r[3] && typeof r[3] === "object" && r[3].uid) S.user = r[3];
    handleGoogleReturn();
    render(); refresh();
  });
})();
</script>
